}

// ===== 이벤트 =====
const ctxOf = (el) => {
  const p = el.closest('.panel');
  return p ? p.id.replace('tab-', '') : null;
};
function findListItem(ctx, kw) {
  if (ctx === 'top') return S.top.doc ? S.top.doc.items.find((i) => i.keyword === kw) : null;
  if (ctx === 'find') return S.find.results.find((i) => i.keyword === kw);
  return null;
}

document.addEventListener('click', async (ev) => {
  const tabBtn = ev.target.closest('[data-tab]');
  if (tabBtn) { showTab(tabBtn.dataset.tab); return; }
  const btn = ev.target.closest('[data-act]');
  if (!btn || btn.disabled) return;
  const act = btn.dataset.act;
  const ctx = ctxOf(btn);
  const kwEl = btn.closest('[data-kw]');
  const kw = kwEl ? kwEl.getAttribute('data-kw') : null;

  switch (act) {
    // --- 계정 ---
    case 'login':
      try { await signInWithPopup(auth, new GoogleAuthProvider()); }
      catch (e) {
        if (e.code === 'auth/popup-blocked') toast('팝업이 차단됨. 브라우저 팝업 허용 후 다시 시도할 것', 4000);
        else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') toast('로그인 실패: ' + (e.code || e.message), 4000);
      }
      break;
    case 'logout':
      if (S.running && !confirm('분석이 진행 중임. 로그아웃할까?')) return;
      if (S.abort) S.abort.abort();
      await signOut(auth);
      break;
    case 'openExternal': openExternal(); break;
    case 'copyUrl': copyWithToast(location.href, '주소를 복사함'); break;
    case 'copyUid': if (S.user) copyWithToast(S.user.uid, 'UID 복사함'); break;
    case 'stop': if (S.abort) S.abort.abort(); break;

    // --- TOP 50 ---
    case 'generate': generateTop50(false); break;
    case 'regen':
      if (confirm('오늘 결과를 다시 생성할까? 기존 결과는 덮어씀 (24시간 캐시는 재사용)')) { lsDel(CP_KEY); generateTop50(false); }
      break;
    case 'resume': generateTop50(true); break;
    case 'restart': lsDel(CP_KEY); generateTop50(false); break;
    case 'csv': {
      const d = S.top.doc;
      if (!d) return;
      const cols = [
        { label: '순위', get: (r) => r.rank }, { label: '변동', get: (r) => r.change }, { label: '키워드', get: (r) => r.keyword },
        { label: '분야', get: (r) => r.category }, { label: '유형', get: (r) => r.type }, { label: '일일점수', get: (r) => r.dailyScore },
        { label: '기회점수', get: (r) => r.opportunityScore }, { label: 'D수요', get: (r) => r.D }, { label: 'T상승', get: (r) => r.T },
        { label: 'Y시즌', get: (r) => r.Y }, { label: 'V안정', get: (r) => r.V }, { label: 'S문서', get: (r) => r.S },
        { label: 'F신선(%)', get: (r) => pct(r.F) }, { label: 'O노후(%)', get: (r) => pct(r.O) }, { label: '전년피크', get: (r) => r.peakMonth },
        { label: '출처', get: (r) => (r.sources || []).map((s) => KR.SOURCE_NAMES[s] || s).join('/') }, { label: '배지', get: (r) => (r.badges || []).join('/') },
      ];
      downloadText(`keyword-radar-top50-${d.date}.csv`, KR.toCSV(applyFilters(d.items, 'top'), cols));
      break;
    }
    case 'copy10': {
      const d = S.top.doc;
      if (!d) return;
      const top10 = KR.sortItems(d.items, 'rank').slice(0, 10);
      copyWithToast(top10.map(KR.buildPrompt).join(KR.PROMPT_SEPARATOR), '상위 10개 분석요청문 복사함');
      break;
    }
    case 'retry':
      if (ctx === 'top') retryTopFailed(kw);
      else if (ctx === 'find') retryFindFailed(kw);
      break;

    // --- 결과 카드 공통 ---
    case 'toggle': {
      const set = S[ctx].open;
      if (set.has(kw)) set.delete(kw); else set.add(kw);
      ctx === 'top' ? renderTop() : renderFind();
      break;
    }
    case 'save': { const it = findListItem(ctx, kw); if (it) { await saveItem(it); ctx === 'top' ? renderTop() : renderFind(); } break; }
    case 'copy': { const it = findListItem(ctx, kw); if (it) copyWithToast(KR.buildPrompt(it), '분석요청문 복사함'); break; }
    case 'jump': {
      S.find.open.add(kw);
      S.find.filter = { cat: '', type: '', src: '', onlyNew: false };
      renderFind();
      const target = [...document.querySelectorAll('#tab-find .list .item')].find((x) => x.getAttribute('data-kw') === kw);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    }

    // --- 주제 찾기 ---
    case 'expand': findExpand(); break;
    case 'analyze': runFindAnalysis(); break;
    case 'chip': { const i = Number(btn.closest('[data-chip]').dataset.chip); S.find.chips[i].selected = !S.find.chips[i].selected; renderFind(); break; }
    case 'chipx': { const i = Number(btn.closest('[data-chip]').dataset.chip); S.find.chips.splice(i, 1); renderFind(); break; }
    case 'addchip': addManualChip(); break;
    case 'chipsAll': S.find.chips.forEach((c) => { c.selected = true; }); renderFind(); break;
    case 'chipsNone': S.find.chips.forEach((c) => { c.selected = false; }); renderFind(); break;
    case 'chipsClear': S.find.chips = []; renderFind(); break;

    // --- 화제 피드 ---
    case 'feedRefresh': refreshFeeds(true); break;
    case 'feedSend': {
      const chip = feedKeyToChip(btn.dataset.key);
      if (!chip) return;
      const n = addChips([chip]);
      toast(n ? `'${chip.keyword}' 주제 찾기 후보에 추가함` : '이미 후보에 있음');
      break;
    }
    case 'feedAnalyze': {
      const chips = [...S.feed.selected].map(feedKeyToChip).filter(Boolean);
      if (!chips.length) return;
      addChips(chips);
      S.find.chips.forEach((c) => { c.selected = chips.some((x) => KR.normKw(x.keyword) === KR.normKw(c.keyword)); });
      S.feed.selected.clear();
      showTab('find');
      runFindAnalysis();
      break;
    }

    // --- 저장함 ---
    case 'sdel':
      if (!confirm(`'${kw}' 저장 키워드를 삭제할까?`)) return;
      try { await deleteDoc(uref('savedKeywords', kwId(kw))); S.saved.delete(kw); renderSaved(); toast('삭제함'); }
      catch (e) { toast('삭제 실패: ' + e.message, 4000); }
      break;
    case 'sreanalyze': reanalyzeSaved(kw); break;
    case 'scopy': { const s = S.saved.get(kw); if (s) copyWithToast(KR.buildPrompt(savedToItem(s)), '분석요청문 복사함'); break; }
    case 'savedCsv': {
      const list = [...S.saved.values()].filter((s) => !S.savedUI.cat || s.category === S.savedUI.cat);
      const cols = [
        { label: '키워드', get: (r) => r.keyword }, { label: '분야', get: (r) => r.category }, { label: '유형', get: (r) => r.type },
        { label: '점수', get: (r) => r.score }, { label: '상태', get: (r) => r.status }, { label: '메모', get: (r) => r.memo },
        { label: '저장일', get: (r) => KR.formatTime(r.savedAt) }, { label: 'D수요', get: (r) => r.metrics && r.metrics.D },
        { label: 'S문서', get: (r) => r.metrics && r.metrics.S },
      ];
      downloadText(`keyword-radar-saved-${KR.kstDate()}.csv`, KR.toCSV(list, cols));
      break;
    }

    // --- 설정 ---
    case 'catadd':
      S.draft.categories.push({ id: KR.newCategoryId(), name: '새 분야', enabled: true, weight: 1, seeds: [] });
      renderSettings();
      break;
    case 'catdel': {
      const id = btn.closest('[data-cat]').dataset.cat;
      const c = S.draft.categories.find((x) => x.id === id);
      if (c && confirm(`'${c.name}' 분야를 삭제할까? (저장 시 반영)`)) { S.draft.categories = S.draft.categories.filter((x) => x.id !== id); renderSettings(); }
      break;
    }
    case 'seedadd': addSeedFromInput(btn.closest('[data-cat]')); break;
    case 'seededit': {
      const box = btn.closest('[data-cat]');
      const c = S.draft.categories.find((x) => x.id === box.dataset.cat);
      const i = Number(btn.closest('[data-seed]').dataset.seed);
      const cur = c.seeds[i];
      const v = prompt('시드 수정 (비우면 삭제, 요일 지정: 단어@토일)', KR.seedLabel(cur));
      if (v === null) return;
      if (!v.trim()) { c.seeds.splice(i, 1); renderSettings(); return; }
      try {
        const p = KR.parseSeed(v);
        if (c.seeds.some((s, j) => j !== i && s.word === p.word)) { toast('같은 시드가 이미 있음'); return; }
        c.seeds[i] = p;
        renderSettings();
      } catch (e) { toast(e.message, 3500); }
      break;
    }
    case 'saveSettings': await saveSettings(); break;
    case 'cacheClear': {
      if (!confirm('키워드 캐시를 모두 삭제할까? 다음 분석 때 API를 다시 호출함')) return;
      try {
        const qs = await getDocs(ucol('keywordCache'));
        const ops = [];
        qs.forEach((d) => ops.push({ type: 'delete', ref: d.ref }));
        await batchWrite(ops);
        toast(`캐시 ${ops.length}건 삭제함`);
      } catch (e) { toast('캐시 초기화 실패: ' + e.message, 4000); }
      break;
    }
    case 'usageReset':
      if (confirm('오늘 API 사용량 카운터를 0으로 되돌릴까? (실제 네이버 사용량과는 무관)')) { lsDel(usageKey()); renderUsage(); toast('초기화함'); }
      break;
    case 'exportSettings':
      downloadText(`keyword-radar-settings-${KR.kstDate()}.json`, JSON.stringify(KR.normalizeSettings(S.draft), null, 2), 'application/json');
      break;
    case 'importSettings': $('#tab-settings [data-el="importFile"]').click(); break;
    default: break;
  }
});

function addManualChip() {
  const input = $('#tab-find [data-el="addchip"]');
  const v = (input.value || '').trim();
  if (!v) return;
  const n = addChips(v.split(/[,，]/).map((s) => s.trim()).filter(Boolean).map((k) => ({ keyword: k, category: S.find.cat || KR.tagCategory(k, S.settings) })));
  input.value = '';
  if (!n) toast('이미 있는 후보임');
  renderFind();
}
function addSeedFromInput(box) {
  const c = S.draft.categories.find((x) => x.id === box.dataset.cat);
  const input = box.querySelector('[data-cf="newseed"]');
  const raw = (input.value || '').trim();
  if (!raw) return;
  let added = 0;
  for (const part of raw.split(/[,，]/)) {
    if (!part.trim()) continue;
    try {
      const p = KR.parseSeed(part);
      if (c.seeds.length >= 30) { toast('분야별 시드는 최대 30개'); break; }
      if (c.seeds.some((s) => s.word === p.word)) continue;
      c.seeds.push(p);
      added++;
    } catch (e) { toast(e.message, 3500); return; }
  }
  if (added) renderSettings();
}

async function saveSettings() {
  const d = S.draft;
  const names = d.categories.map((c) => c.name.trim());
  if (names.some((n) => !n)) { toast('분야 이름이 비어 있음'); return; }
  if (new Set(names).size !== names.length) { toast('분야 이름이 중복됨'); return; }
  if (!String(d.anchor || '').trim()) { toast('앵커 키워드를 입력할 것'); return; }
  const next = KR.normalizeSettings(d);
  const anchorChanged = next.anchor !== S.settings.anchor;
  try {
    await setDoc(uref('settings', 'main'), clean(next));
    S.settings = next;
    S.draft = clone(next);
    renderSettings();
    toast(anchorChanged ? '저장함. 앵커가 바뀌어 다음 분석 때 트렌드를 다시 조회함' : '설정 저장함', 3500);
  } catch (e) {
    toast('설정 저장 실패: ' + e.message, 4000);
  }
}

// 입력 변경 (재렌더링 없이 상태만 갱신)
function setPath(obj, path, val) {
  const ks = path.split('.');
  let o = obj;
  ks.slice(0, -1).forEach((k) => { o = o[k]; });
  o[ks[ks.length - 1]] = val;
}
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.matches('#tab-find [data-el="seeds"]')) S.find.seedsInput = t.value;
  else if (t.matches('#tab-find [data-el="shop"]')) S.find.shop = t.value;
  else if (t.matches('[data-set]') && S.draft) {
    const path = t.dataset.set;
    if (t.type === 'checkbox') setPath(S.draft, path, t.checked);
    else if (t.type === 'number') setPath(S.draft, path, Number(t.value));
    else if (path === 'stopwords' || path === 'excludeKeywords') setPath(S.draft, path, t.value.split(/[,，\n]/).map((s) => s.trim()).filter(Boolean));
    else setPath(S.draft, path, t.value);
  } else if (t.matches('[data-cf]') && S.draft) {
    const c = S.draft.categories.find((x) => x.id === t.closest('[data-cat]').dataset.cat);
    if (!c) return;
    if (t.dataset.cf === 'name') c.name = t.value;
    else if (t.dataset.cf === 'enabled') c.enabled = t.checked;
    else if (t.dataset.cf === 'weight') c.weight = KR.clamp(Number(t.value) || 1, 0.5, 2);
  } else if (t.matches('[data-local="workerUrl"]')) {
    lsSet('kr_worker_url', t.value.trim());
  }
});
document.addEventListener('change', async (ev) => {
  const t = ev.target;
  const ctx = ctxOf(t);
  if (t.matches('[data-flt]') && (ctx === 'top' || ctx === 'find')) {
    const k = t.dataset.flt;
    if (k === 'sort') S[ctx].sort = t.value;
    else if (k === 'onlyNew') S[ctx].filter.onlyNew = t.checked;
    else S[ctx].filter[k] = t.value;
    ctx === 'top' ? renderTop() : renderFind();
  } else if (t.matches('#tab-top [data-el="date"]')) {
    loadDaily(t.value);
  } else if (t.matches('#tab-find [data-el="cat"]')) {
    S.find.cat = t.value;
  } else if (t.matches('#tab-feed [data-sel]')) {
    if (t.checked) S.feed.selected.add(t.dataset.sel); else S.feed.selected.delete(t.dataset.sel);
    const b = $('#tab-feed [data-act="feedAnalyze"]');
    if (b) { b.textContent = `선택 항목 분석 (${S.feed.selected.size})`; b.disabled = !S.feed.selected.size || S.running; }
  } else if (t.matches('#tab-saved [data-el="savedCat"]')) {
    S.savedUI.cat = t.value;
    renderSaved();
  } else if (t.matches('#tab-saved [data-el="status"]')) {
    const kw = t.closest('[data-kw]').getAttribute('data-kw');
    await updateSaved(kw, { status: t.value });
    toast(t.value === '발행' ? '발행 처리함. TOP 50 선정에서 제외됨' : '상태 변경함');
  } else if (t.matches('#tab-saved [data-el="memo"]')) {
    const kw = t.closest('[data-kw]').getAttribute('data-kw');
    await updateSaved(kw, { memo: t.value });
    toast('메모 저장함');
  } else if (t.matches('#tab-settings [data-el="importFile"]')) {
    const file = t.files && t.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      S.draft = KR.normalizeSettings(data);
      renderSettings();
      toast('가져왔음. [설정 저장]을 눌러야 반영됨', 4000);
    } catch (e) {
      toast('JSON 형식 오류: ' + e.message, 4000);
    }
    t.value = '';
  }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter' || ev.isComposing) return;
  const t = ev.target;
  if (t.matches('#tab-find [data-el="addchip"]')) { ev.preventDefault(); addManualChip(); }
  else if (t.matches('#tab-find [data-el="seeds"]')) { ev.preventDefault(); if (!S.running) findExpand(); }
  else if (t.matches('[data-cf="newseed"]')) { ev.preventDefault(); addSeedFromInput(t.closest('[data-cat]')); }
});
// 분석 중 이탈 경고
window.addEventListener('beforeunload', (ev) => {
  if (!S.running) return;
  ev.preventDefault();
  ev.returnValue = '';
});

// ===== 시작 =====
function init() {
  renderUsage();
  if (!CONFIG.FIREBASE.apiKey || CONFIG.FIREBASE.apiKey.startsWith('YOUR')) { showGate('config'); return; }
  fbApp = initializeApp(CONFIG.FIREBASE);
  auth = getAuth(fbApp);
  db = getFirestore(fbApp);
  showGate('loading');
  onAuthStateChanged(auth, async (user) => {
    S.user = user;
    if (!user) { showGate('login'); return; }
    if (CONFIG.ALLOWED_UID && user.uid !== CONFIG.ALLOWED_UID) { showGate('denied'); return; }
    showGate('loading');
    try {
      await Promise.all([loadSettings(), loadSaved(), loadIndex()]);
      S.draft = clone(S.settings);
      showApp();
      await loadDaily(KR.kstDate());
    } catch (e) {
      showGate('error', e);
    }
  });
}
init();
</script>
</body>
</html>
