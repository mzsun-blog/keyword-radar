<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<title>KEYWORD RADAR</title>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--line:#e2e5ea;--text:#1b2129;--muted:#6a7380;
  --accent:#2563eb;--accent-weak:#e8efff;--good:#15803d;--bad:#c53030;--warn:#b45309;
  --issue:#dc2626;--season:#d97706;--ever:#059669;--etc:#64748b;
  --bar:#2563eb;--radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1318;--card:#171c23;--line:#2a313b;--text:#e6e9ee;--muted:#9aa3af;
    --accent:#6b9bff;--accent-weak:#1c2a45;--good:#4ade80;--bad:#f87171;--warn:#fbbf24;
    --issue:#f87171;--season:#fbbf24;--ever:#34d399;--etc:#94a3b8;--bar:#6b9bff;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",NanumGothic,sans-serif;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px;width:100%;max-width:100%}
textarea{resize:vertical;min-height:auto}
input[type=checkbox]{width:18px;height:18px;min-height:0;padding:0;accent-color:var(--accent);flex:none}
code{font-size:12px;background:var(--accent-weak);padding:1px 5px;border-radius:4px;word-break:break-all}
.small{font-size:13px}.muted{color:var(--muted)}.bad-t{color:var(--bad)}
.grow{flex:1}
[hidden]{display:none!important}

/* 상단 */
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px calc(8px);padding-top:max(10px,env(safe-area-inset-top));display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.brand{font-weight:800;letter-spacing:.04em;font-size:16px}
.brand i{font-style:normal;color:var(--accent)}
#usage{display:flex;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
#usage b{color:var(--text)}
#who{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
#who .small{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs{position:sticky;top:var(--hdr,52px);z-index:19;background:var(--card);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:11px 14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:960px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}

/* 공통 요소 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 12px}
.card h3{margin:0 0 10px;font-size:15px}
.card.gate{max-width:460px;margin:40px auto;text-align:center;padding:28px 20px}
.card.gate h2{margin:0 0 8px}
.lbl{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.row>input,.row>select{flex:1 1 180px;width:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar select{width:auto;flex:0 1 auto}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:600;white-space:nowrap;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.big{font-size:17px;padding:14px 26px;min-height:52px}
.btn.small{padding:4px 10px;min-height:32px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-align:left}
.notice{background:var(--accent-weak);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;font-size:14px}
.notice.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.hero{text-align:center;padding:40px 10px}
.hero p{margin:12px 0 0;color:var(--muted);font-size:14px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1b2129;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 진행 */
.progress{background:var(--card);border:1px solid var(--accent);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.pg-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pg-bar{height:8px;background:var(--accent-weak);border-radius:4px;margin:10px 0 6px;overflow:hidden}
.pg-bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.pg-meta{font-size:13px;color:var(--muted)}

/* 메타·필터 */
.meta-bar{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.meta-bar .row{margin-top:8px}
.st.complete{color:var(--good);font-weight:700}.st.partial{color:var(--warn);font-weight:700}
.seedlist{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.seedlist span{background:var(--bg);border-radius:4px;padding:1px 6px}
.seedlist span.dayseed{background:var(--accent-weak);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.filters select{width:auto;flex:1 1 120px;min-height:36px;padding:6px 8px;font-size:14px}

/* 결과 리스트 */
.list{display:flex;flex-direction:column;gap:6px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.item.open{border-color:var(--accent)}
.item-head{display:block;width:100%;background:none;border:0;text-align:left;padding:10px 12px;cursor:pointer}
.item-head .l1{display:flex;align-items:center;gap:8px;min-width:0}
.rank{flex:none;width:26px;text-align:center;font-weight:800;font-size:16px}
.chg{flex:none;width:38px;font-size:12px;font-weight:700;text-align:center}
.chg.up{color:var(--issue)}.chg.down{color:var(--accent)}.chg.same{color:var(--muted)}.chg.new{color:var(--good)}
.kw{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.srcs{flex:none;display:inline-flex;gap:3px}
.src{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font-size:11px;font-weight:800;color:#fff}
.src-naver{background:#03c75a}.src-google{background:#4285f4}.src-youtube{background:#e62117}.src-pann{background:#f26b21}.src-theqoo{background:#7b5cff}
.item-head .l2{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:6px 0 0 34px}
.badge{display:inline-block;font-size:11.5px;line-height:1.2;padding:3px 7px;border-radius:5px;background:var(--bg);color:var(--muted);font-weight:600;white-space:nowrap}
.badge.cat{background:var(--accent-weak);color:var(--accent)}
.badge.t-issue{background:transparent;border:1px solid var(--issue);color:var(--issue)}
.badge.t-season{background:transparent;border:1px solid var(--season);color:var(--season)}
.badge.t-ever{background:transparent;border:1px solid var(--ever);color:var(--ever)}
.badge.t-etc{background:transparent;border:1px solid var(--etc);color:var(--etc)}
.badge.flag{background:transparent;color:var(--warn);padding-left:2px;padding-right:2px}
.score{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-width:120px}
.score .bar{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;min-width:60px}
.score .bar i{display:block;height:100%;background:var(--bar)}
.score b{font-size:14px;min-width:34px;text-align:right}
.item-body{border-top:1px solid var(--line);padding:12px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.metrics .m{background:var(--bg);border-radius:8px;padding:7px 8px;display:flex;flex-direction:column;min-width:0}
.metrics .m span{font-size:12px;color:var(--muted)}
.metrics .m b{font-size:16px}
.metrics .m small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spark-box{margin-top:10px}
.spark{display:block;width:100%;height:56px;margin-top:4px}
.sp-line{stroke:var(--accent);stroke-width:2}
.sp-area{fill:var(--accent-weak)}
.pattern{margin-top:10px;color:var(--muted)}
.top10{margin:8px 0 0;padding-left:22px;font-size:14px}
.top10 li{margin:3px 0}
.top10 small{color:var(--muted);margin-left:6px;white-space:nowrap}
.failed summary{cursor:pointer;color:var(--warn);font-weight:600}
.frow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.frow small{flex:1;min-width:120px}

/* 주제 찾기 */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.chip button{background:none;border:0;padding:5px 10px;cursor:pointer;font-size:14px}
.chip button[data-act=chipx]{padding:5px 9px 5px 2px;color:var(--muted)}
.chip.on{border-color:var(--accent);background:var(--accent-weak)}
.chip.on button{color:var(--accent);font-weight:600}
.chip small{font-size:11px;color:var(--warn)}
.chip .day{color:var(--warn);margin-left:2px}
.rec{margin:0;padding-left:22px}
.rec li{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.rec li b{margin-left:auto}

/* 화제 피드 */
details.card>summary{cursor:pointer;font-weight:700;list-style:revert}
.card.pin{border-color:var(--accent)}
.fitem{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.fitem:first-of-type{border-top:0}
.ftitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem small{flex:none;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 저장함 */
.sitem .l1{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sitem .kw{flex:1 1 auto}
.sitem .sc{font-weight:800}
.sitem textarea{margin-top:8px}
.sitem select{flex:0 1 110px}

/* 설정 */
.catbox{border:1px solid var(--line);border-radius:8px;padding:10px;margin:10px 0}
.catbox .row:first-child{margin-top:0}
.w-num{width:76px!important;flex:none!important}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid2 label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;text-align:center;margin:4px 0 14px}
.savebar .btn{box-shadow:0 4px 14px rgba(0,0,0,.18)}
.uid{margin-top:8px}

@media (max-width:600px){
  main{padding:12px 12px calc(40px + env(safe-area-inset-bottom))}
  header.top{padding-left:12px;padding-right:12px}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .score{min-width:100%;margin-left:0}
  .item-head .l2{margin-left:0}
  .chg{width:32px}
  .fitem small{display:none}
  #who .small{max-width:110px}
}
</style>
</head>
<body>
<header class="top" id="hdr">
  <div class="brand">KEYWORD <i>RADAR</i></div>
  <div id="usage"></div>
  <div id="who"></div>
</header>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="top" class="on">오늘의 TOP 50</button>
  <button data-tab="find">주제 찾기</button>
  <button data-tab="feed">화제 피드</button>
  <button data-tab="saved">저장함</button>
  <button data-tab="settings">설정</button>
</nav>
<main>
  <section id="gate"></section>
  <section id="tab-top" class="panel" hidden></section>
  <section id="tab-find" class="panel" hidden></section>
  <section id="tab-feed" class="panel" hidden></section>
  <section id="tab-saved" class="panel" hidden></section>
  <section id="tab-settings" class="panel" hidden></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* =====================================================================
 * KEYWORD RADAR 분석 엔진 (순수 함수 모음, DOM·네트워크 미사용)
 * - 날짜(KST), 텍스트 정제, 후보 확장, 외부 피드 정제
 * - 지표 계산(D·T·Y·V·S·F·O), 점수·유형 분류, TOP 50 선정
 * - 분석요청문·CSV 생성, 기본 설정값
 * ===================================================================== */
(function (root) {
  'use strict';
  const KR = {};

  // ---------- 날짜 (모두 KST 기준, 'YYYY-MM-DD' 문자열) ----------
  const KST = 9 * 3600 * 1000;
  KR.kstDate = (ms = Date.now()) => new Date(ms + KST).toISOString().slice(0, 10);
  KR.addDays = (ds, n) => {
    const d = new Date(ds + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  };
  // a - b (일)
  KR.diffDays = (a, b) => Math.round((Date.parse(a + 'T00:00:00Z') - Date.parse(b + 'T00:00:00Z')) / 864e5);
  KR.weekdayChar = (ds) => '일월화수목금토'[new Date(ds + 'T00:00:00Z').getUTCDay()];
  KR.dayIndex = (ds) => Math.floor(Date.parse(ds + 'T00:00:00Z') / 864e5);
  KR.postdateToStr = (pd) => {
    const s = String(pd || '');
    return /^\d{8}$/.test(s) ? `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6, 8)}` : null;
  };
  KR.pubDateToStr = (s) => {
    const t = Date.parse(s);
    return Number.isNaN(t) ? null : KR.kstDate(t);
  };
  KR.formatTime = (ms) => new Date(Number(ms) + KST).toISOString().slice(0, 16).replace('T', ' ');

  // ---------- 수치 ----------
  KR.round = (v, d = 1) => {
    if (!Number.isFinite(v)) return 0;
    const p = 10 ** d;
    return Math.round(v * p) / p;
  };
  KR.clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  KR.mean = (a) => (a && a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0);
  KR.std = (a) => {
    if (!a || !a.length) return 0;
    const m = KR.mean(a);
    return Math.sqrt(KR.mean(a.map((v) => (v - m) ** 2)));
  };

  // ---------- 텍스트 정제 ----------
  const ENT = { '&quot;': '"', '&amp;': '&', '&lt;': '<', '&gt;': '>', '&#39;': "'", '&apos;': "'", '&nbsp;': ' ' };
  KR.decode = (s) =>
    String(s || '')
      .replace(/&(quot|amp|lt|gt|apos|nbsp|#39);/g, (m) => ENT[m])
      .replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(Number(n)))
      .replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16)));
  KR.stripTags = (s) => String(s || '').replace(/<[^>]*>/g, '');
  // 화면 표시용 제목 (태그 제거 + 엔티티 복원)
  KR.displayTitle = (s) => KR.decode(KR.stripTags(s)).replace(/\s+/g, ' ').trim();
  // 이모지·특수문자 제거 (글자·숫자·공백만 남김)
  const basicClean = (s) =>
    String(s || '')
      .replace(/\p{Extended_Pictographic}/gu, ' ')
      .replace(/[‍️]/g, '')
      .replace(/[^\p{L}\p{N}\s]/gu, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  // 블로그 제목 정제: 태그·엔티티·이모지·특수문자 제거
  KR.cleanBlog = (s) => basicClean(KR.displayTitle(s));
  // 외부 피드 제목 정제: 대괄호류 내용까지 제거
  KR.cleanFeed = (s) => basicClean(KR.displayTitle(s).replace(/\[[^\]]*\]|【[^】]*】|〔[^〕]*〕/g, ' '));

  // 조사 제거 (남는 글자가 2자 이상일 때만, 오인식이 잦은 단일 조사 '이·가·도·만·와·과·로'는 제외)
  const PARTICLES = ['에서는', '에서도', '으로는', '이라는', '에서', '으로', '에게', '까지', '부터', '이란', '에는', '이나', '처럼', '보다', '하는', '하기', '하고', '하면', '해서', '은', '는', '을', '를', '에'];
  const NO_STRIP_END = ['가을', '마을', '고을'];
  KR.stripParticle = (tok) => {
    if (NO_STRIP_END.some((e) => tok.endsWith(e))) return tok;
    for (const p of PARTICLES) {
      if (tok.length - p.length >= 2 && tok.endsWith(p)) return tok.slice(0, -p.length);
    }
    return tok;
  };
  KR.tokenize = (text, cleaner = KR.cleanBlog) =>
    cleaner(text)
      .split(/\s+/)
      .filter(Boolean)
      .map(KR.stripParticle);

  const YEAR_RE = /^(19|20)\d{2}(년|년도)?$/;
  KR.makeStopSet = (list) => new Set((list || []).map((w) => String(w).trim()).filter(Boolean));
  KR.isStopToken = (tok, stopSet) =>
    !tok || stopSet.has(tok) || (stopSet.has('연도') && YEAR_RE.test(tok)) || /^\d+$/.test(tok);

  // ---------- 시드 (요일 지정 '@요일') ----------
  const DAY_CHARS = '월화수목금토일';
  KR.DAY_CHARS = DAY_CHARS;
  KR.parseSeed = (raw) => {
    const s = String(raw || '').trim();
    if (!s) return null;
    const at = s.lastIndexOf('@');
    if (at < 0) return { word: s, days: [] };
    const word = s.slice(0, at).trim();
    const dayStr = s.slice(at + 1).replace(/\s/g, '');
    if (!word) throw new Error('시드 단어가 비어 있음');
    const days = [];
    for (const ch of dayStr) {
      if (!DAY_CHARS.includes(ch)) throw new Error(`허용되지 않은 요일 글자: ${ch} (월화수목금토일만 가능)`);
      if (!days.includes(ch)) days.push(ch);
    }
    days.sort((a, b) => DAY_CHARS.indexOf(a) - DAY_CHARS.indexOf(b));
    return { word, days };
  };
  KR.seedLabel = (s) => (s.days && s.days.length ? `${s.word}@${s.days.join('')}` : s.word);
  KR.seedWord = (raw) => String(raw || '').split('@')[0].trim();

  // 오늘 사용할 시드 선정: 분야 가중치 비율로 할당, 오늘 요일 지정 시드 우선, 나머지는 요일별 순환
  KR.selectSeeds = (settings, ds) => {
    const total = settings.seedTotal || 70;
    const cats = (settings.categories || []).filter((c) => c.enabled && c.seeds && c.seeds.length);
    const sumW = cats.reduce((s, c) => s + (Number(c.weight) || 1), 0);
    if (!cats.length || sumW <= 0) return [];
    const wd = KR.weekdayChar(ds);
    const di = KR.dayIndex(ds);
    const day = [];
    const reg = [];
    for (const c of cats) {
      const quota = Math.max(1, Math.round((total * (Number(c.weight) || 1)) / sumW));
      const daySeeds = c.seeds.filter((s) => s.days && s.days.includes(wd));
      const regular = c.seeds.filter((s) => !s.days || !s.days.length);
      const picked = daySeeds.slice(0, quota);
      picked.forEach((s) => day.push({ word: s.word, category: c.name, isDaySeed: true }));
      const remain = quota - picked.length;
      if (remain > 0 && regular.length) {
        const n = Math.min(remain, regular.length);
        const offset = (di * n) % regular.length;
        for (let i = 0; i < n; i++) {
          const s = regular[(offset + i) % regular.length];
          reg.push({ word: s.word, category: c.name, isDaySeed: false });
        }
      }
    }
    // 반올림으로 총량을 넘으면 요일 지정 시드를 우선 유지
    return [...day, ...reg].slice(0, Math.max(total, day.length));
  };

  // ---------- 후보 확장 (블로그 sim 제목 → 시드 포함 2~3어절 조합 빈도) ----------
  KR.expandSeed = (titles, seed, stopSet, minCount = 2) => {
    const seedToks = KR.tokenize(KR.seedWord(seed));
    if (!seedToks.length) return [];
    const L = seedToks.length;
    const seedPhrase = seedToks.join(' ');
    const counts = new Map();
    for (const title of titles) {
      const toks = KR.tokenize(title);
      const seen = new Set();
      for (let j = 0; j + L <= toks.length; j++) {
        let ok = true;
        for (let k = 0; k < L; k++) {
          const t = toks[j + k];
          const s = seedToks[k];
          if (!(t === s || (L === 1 && t.includes(s)))) {
            ok = false;
            break;
          }
        }
        if (!ok) continue;
        for (let a = Math.max(0, j - 2); a <= j; a++) {
          for (let b = j + L - 1; b <= Math.min(toks.length - 1, j + L + 1); b++) {
            const n = b - a + 1;
            if (n < 2 || n > 3) continue;
            let bad = false;
            for (let x = a; x <= b; x++) {
              if (x >= j && x < j + L) continue; // 시드 구간은 불용어 검사 제외
              if (KR.isStopToken(toks[x], stopSet) || toks[x].length < 2) {
                bad = true;
                break;
              }
            }
            if (bad) continue;
            const phrase = toks.slice(a, b + 1).join(' ');
            if (phrase === seedPhrase || seen.has(phrase)) continue;
            seen.add(phrase);
            counts.set(phrase, (counts.get(phrase) || 0) + 1);
          }
        }
      }
    }
    return [...counts.entries()]
      .filter(([, c]) => c >= minCount)
      .sort((x, y) => y[1] - x[1] || x[0].length - y[0].length)
      .map(([phrase, count]) => ({ phrase, count }));
  };

  // ---------- 외부 피드 정제 ----------
  KR.FEED_SOURCES = ['google', 'youtube', 'pann', 'theqoo'];
  KR.SOURCE_NAMES = { naver: '네이버', google: '구글 트렌드', youtube: '유튜브', pann: '네이트 판', theqoo: '더쿠' };
  const VERB_ENDS = ['습니다', '합니다', '했다', '한다', '된다', '있다', '없다', '였다', '이다', '했던', '하는', '에서', '까지', '네요', '어요', '아요', '해요', '세요', '지만', '는데', '라고', '다고', '면서', '니다', '했어', '했나', '할까', '일까', '인가', '는가', '하다', '했음', '하네', '해서', '한테'];
  KR.isNounLike = (tok) =>
    tok.length >= 2 &&
    !/^\d+$/.test(tok) &&
    !VERB_ENDS.some((e) => tok.length > e.length && tok.endsWith(e)) &&
    !(tok.length >= 3 && /[다요죠]$/.test(tok)) &&
    !/(ㅋ|ㅎ|ㅠ|ㅜ){2,}/.test(tok);

  // feeds: { google:[{title,link,metric}], youtube:[...], pann:[...], theqoo:[...] } (실패 소스는 생략)
  KR.extractFeedKeywords = (feeds, stopSet, max = 80) => {
    const norm = {};
    for (const src of KR.FEED_SOURCES) {
      norm[src] = (feeds[src] || []).map((it) => KR.cleanFeed(it.title).replace(/\s+/g, ''));
    }
    const cand = new Map();
    const add = (phrase, patch) => {
      const cur = cand.get(phrase) || { keyword: phrase, freq: 0, googleRank: null, traffic: 0 };
      Object.assign(cur, patch, { freq: cur.freq + 1 });
      cand.set(phrase, cur);
    };
    // 구글 트렌드: 검색어 자체가 후보 (유입량 순위 부여)
    const g = (feeds.google || [])
      .map((it) => ({ ...it, metric: Number(it.metric) || 0 }))
      .sort((a, b) => b.metric - a.metric);
    g.forEach((it, idx) => {
      const q = KR.cleanFeed(it.title);
      const toks = q.split(' ').filter(Boolean);
      if (!toks.length || toks.length > 4) return;
      if (toks.length === 1 && toks[0].length < 2) return;
      if (toks.every((t) => KR.isStopToken(t, stopSet))) return;
      add(q, { googleRank: idx + 1, traffic: it.metric });
    });
    // 유튜브·판·더쿠: 제목에서 2~3어절 명사구
    for (const src of ['youtube', 'pann', 'theqoo']) {
      for (const it of feeds[src] || []) {
        const toks = KR.tokenize(it.title, KR.cleanFeed);
        const seen = new Set();
        for (let n = 2; n <= 3; n++) {
          for (let i = 0; i + n <= toks.length; i++) {
            const win = toks.slice(i, i + n);
            if (!win.every((t) => KR.isNounLike(t) && !KR.isStopToken(t, stopSet))) continue;
            const p = win.join(' ');
            if (seen.has(p)) continue;
            seen.add(p);
            add(p, {});
          }
        }
      }
    }
    // 출처 판정: 공백 제거 문자열이 소스 제목에 포함되면 해당 소스 출처로 봄
    const out = [];
    for (const c of cand.values()) {
      const key = c.keyword.replace(/\s+/g, '');
      if (key.length < 2) continue;
      const sources = KR.FEED_SOURCES.filter((src) => norm[src].some((t) => t.includes(key)));
      if (c.googleRank && !sources.includes('google')) sources.unshift('google');
      const cross = sources.length >= 2;
      if (!c.googleRank && !cross && c.freq < 2) continue; // 단일 소스 1회 등장은 잡음으로 보고 제외
      out.push({ keyword: c.keyword, sources, cross, googleRank: c.googleRank, traffic: c.traffic, freq: c.freq });
    }
    out.sort(
      (a, b) =>
        Number(b.cross) - Number(a.cross) ||
        b.sources.length - a.sources.length ||
        (a.googleRank || 999) - (b.googleRank || 999) ||
        b.freq - a.freq
    );
    // 긴 구가 이미 선택됐고 짧은 구가 그 일부이면서 빈도가 같으면 짧은 구 제외
    const picked = [];
    for (const c of out) {
      if (picked.length >= max) break;
      const key = c.keyword.replace(/\s+/g, '');
      const dup = picked.some((p) => p.keyword.replace(/\s+/g, '').includes(key) && p.freq >= c.freq && !c.googleRank);
      if (!dup) picked.push(c);
    }
    return picked;
  };

  // 피드 항목 하나에서 후보로 보낼 키워드 추정
  KR.guessKeywordFromTitle = (title, source, feedCands) => {
    const clean = KR.cleanFeed(title);
    if (source === 'google') return clean;
    const key = clean.replace(/\s+/g, '');
    const hit = (feedCands || []).find((c) => key.includes(c.keyword.replace(/\s+/g, '')));
    if (hit) return hit.keyword;
    const toks = KR.tokenize(title, KR.cleanFeed).filter(KR.isNounLike);
    return toks.slice(0, 2).join(' ') || clean.slice(0, 20);
  };

  // 분야 자동 분류: 분야 시드 단어가 키워드에 포함되면 그 분야
  KR.tagCategory = (kw, settings) => {
    const n = kw.replace(/\s+/g, '');
    for (const c of settings.categories || []) {
      if (!c.enabled) continue;
      for (const s of c.seeds || []) {
        const w = s.word.replace(/\s+/g, '');
        if (w.length >= 2 && n.includes(w)) return c.name;
      }
    }
    return '기타';
  };
  KR.categoryWeight = (settings, name) => {
    const c = (settings.categories || []).find((x) => x.name === name);
    return c ? Number(c.weight) || 1 : 1;
  };
  KR.normKw = (s) => String(s || '').replace(/\s+/g, '').toLowerCase();

  // ---------- 트렌드 지표 ----------
  // 데이터랩 결과의 기간 목록(오름차순). 마지막 주가 미완성이면 제외
  KR.buildGrid = (results, endDate) => {
    const set = new Set();
    (results || []).forEach((r) => (r.data || []).forEach((d) => set.add(d.period)));
    const grid = [...set].sort();
    while (grid.length && KR.addDays(grid[grid.length - 1], 6) > endDate) grid.pop();
    return grid;
  };
  KR.seriesFor = (result, grid) => {
    const m = new Map();
    ((result && result.data) || []).forEach((d) => m.set(d.period, Number(d.ratio) || 0));
    return grid.map((p) => m.get(p) || 0);
  };
  KR.trendMetrics = (series, anchorSeries, grid) => {
    const N = series.length;
    const allZero = series.every((v) => v === 0);
    const kw12 = KR.mean(series.slice(-12));
    const an12 = KR.mean(anchorSeries.slice(-12));
    const D = an12 > 0 ? KR.round((kw12 / an12) * 100, 1) : 0;
    const last4 = KR.mean(series.slice(Math.max(0, N - 4)));
    const prev8 = KR.mean(series.slice(Math.max(0, N - 12), Math.max(0, N - 4)));
    const Tlack = prev8 === 0;
    const T = Tlack ? 0 : KR.round(last4 / prev8, 2);
    const last52 = series.slice(-52);
    const m52 = KR.mean(last52);
    const V = m52 > 0 ? KR.round(KR.std(last52) / m52, 2) : 0;
    // 시즌성: 전년 같은 주 기준 -4주 ~ +8주 구간 최고값 / 52주 평균
    const i0 = N - 1 - 52;
    let Y = 0;
    let peakOffset = null;
    let peakMonth = '';
    if (i0 >= 0) {
      const lo = Math.max(0, i0 - 4);
      const hi = Math.min(N - 1, i0 + 8);
      let pk = lo;
      for (let i = lo; i <= hi; i++) if (series[i] > series[pk]) pk = i;
      Y = m52 > 0 ? KR.round(series[pk] / m52, 2) : 0;
      peakOffset = pk - i0;
      peakMonth = grid[pk] ? grid[pk].slice(0, 7) : '';
    }
    const seasonal = Y >= 1.5 && peakOffset !== null && peakOffset >= 4 && peakOffset <= 8;
    return {
      D, T, Tlack, Y, V, peakOffset, peakMonth, seasonal, allZero,
      sparkline52: last52.map((v) => KR.round(v, 1)),
    };
  };

  // ---------- 공급 지표 ----------
  KR.titlePattern = (titles) => {
    const n = titles.length;
    if (!n) return { avgLen: 0, numRate: 0, yearRate: 0, qRate: 0 };
    const pct = (f) => Math.round((titles.filter(f).length / n) * 100);
    return {
      avgLen: KR.round(KR.mean(titles.map((t) => t.length)), 1),
      numRate: pct((t) => /\d/.test(t)),
      yearRate: pct((t) => /(19|20)\d{2}/.test(t)),
      qRate: pct((t) => /[?？]/.test(t) || /(까|나요|는지|인가요?|일까요?)\s*$/.test(t)),
    };
  };
  // sim: 블로그 sim 응답, date: 블로그 date 응답, news: 뉴스 date 응답
  KR.supplyMetrics = (sim, date, news, today) => {
    const simItems = (sim && sim.items) || [];
    const top10 = simItems.slice(0, 10).map((it) => ({
      t: KR.displayTitle(it.title),
      l: it.link || '',
      d: KR.postdateToStr(it.postdate) || '',
    }));
    const dItems = (date && date.items) || [];
    const recent = dItems.filter((it) => {
      const d = KR.postdateToStr(it.postdate);
      if (!d) return false;
      const g = KR.diffDays(today, d);
      return g >= 0 && g <= 7;
    }).length;
    const F = dItems.length ? KR.round(recent / dItems.length, 2) : 0;
    const old = top10.filter((x) => x.d && KR.diffDays(today, x.d) > 365).length;
    const O = top10.length ? KR.round(old / top10.length, 2) : 0;
    const nItems = (news && news.items) || [];
    const news7 = nItems.filter((it) => {
      const d = KR.pubDateToStr(it.pubDate);
      return d && KR.diffDays(today, d) <= 7;
    }).length;
    return {
      S: Number(sim && sim.total) || 0,
      F, O, top10Titles: top10,
      titlePattern: KR.titlePattern(top10.map((x) => x.t)),
      newsTotal: Number(news && news.total) || 0,
      news7,
    };
  };

  // ---------- 점수·유형 ----------
  // cand: {keyword, category, origin('seed'|'feed'), sources[], isDaySeed, googleRank, cross}
  KR.composeItem = (cand, trend, supply, settings) => {
    const w = settings.weights;
    const b = settings.bonus;
    const it = {
      keyword: cand.keyword,
      category: cand.category || '기타',
      origin: cand.origin || 'seed',
      sources: cand.sources && cand.sources.length ? cand.sources : ['naver'],
      isDaySeed: !!cand.isDaySeed,
      googleRank: cand.googleRank || null,
      cross: !!cand.cross,
      badges: [],
    };
    if (trend) {
      Object.assign(it, {
        D: trend.D, T: trend.T, Y: trend.Y, V: trend.V,
        peakMonth: trend.peakMonth, peakOffset: trend.peakOffset,
        sparkline52: trend.sparkline52 || [],
      });
    }
    if (supply) {
      Object.assign(it, {
        S: supply.S, F: supply.F, O: supply.O,
        top10Titles: supply.top10Titles, titlePattern: supply.titlePattern,
        newsTotal: supply.newsTotal, news7: supply.news7,
      });
    }
    const allZero = !trend || trend.allZero;
    const newIssue = it.origin === 'feed' && trend && !trend.allZero && trend.Tlack;
    if (it.cross) it.badges.push('교차 화제');
    if (allZero) it.badges.push('검색량 매우 적음');
    if (newIssue) it.badges.push('신규 이슈');
    else if (trend && !trend.allZero && trend.Tlack) it.badges.push('데이터부족');
    if (trend && trend.D > 1000) it.badges.push('앵커 변경 권장');
    if (it.isDaySeed) it.badges.push('요일 시드');

    if (allZero || !supply) {
      it.opportunityScore = null;
      it.dailyScore = null;
      it.type = '기타';
      return it;
    }
    const demand = Math.min(1, it.D / 100);
    const sup = Math.min(1, Math.log10(it.S + 1) / 6);
    const rise = newIssue ? 1 : KR.clamp((it.T - 0.8) / 0.7, 0, 1);
    it.opportunityScore = KR.round(w.demand * demand + w.supply * (1 - sup) + w.rise * rise + w.old * it.O, 1);

    if (newIssue || (it.T >= 1.5 && it.F >= 0.3) || (it.isDaySeed && it.F >= 0.3)) it.type = '이슈';
    else if (trend.seasonal) it.type = '시즌';
    else if (it.V < 0.25) it.type = '에버그린';
    else it.type = '기타';

    const bonus = (it.cross ? Number(b.cross) || 0 : 0) + (it.googleRank && it.googleRank <= 10 ? Number(b.googleTop) || 0 : 0);
    it.dailyScore = KR.round((it.opportunityScore + bonus) * KR.categoryWeight(settings, it.category), 1);
    return it;
  };

  // ---------- TOP 50 선정 ----------
  KR.selectTop = (items, settings, excluded) => {
    const ex = excluded || new Set();
    const ok = items
      .filter((it) => it.dailyScore != null && (it.S || 0) >= 10 && !ex.has(KR.normKw(it.keyword)))
      .sort((a, b) => b.dailyScore - a.dailyScore);
    const issueN = Number(settings.ratio.issue) || 0;
    const restN = Number(settings.ratio.rest) || 0;
    const total = issueN + restN;
    const cap = Number(settings.categoryCap) || 999;
    const picked = [];
    const used = new Set();
    const catCount = {};
    const take = (it) => {
      if (used.has(it.keyword)) return false;
      if ((catCount[it.category] || 0) >= cap) return false;
      used.add(it.keyword);
      catCount[it.category] = (catCount[it.category] || 0) + 1;
      picked.push(it);
      return true;
    };
    const issues = ok.filter((i) => i.type === '이슈');
    const rest = ok.filter((i) => i.type === '시즌' || i.type === '에버그린');
    const etc = ok.filter((i) => i.type === '기타');
    let n = 0;
    for (const it of issues) { if (n >= issueN) break; if (take(it)) n++; }
    n = 0;
    for (const it of rest) { if (n >= restN) break; if (take(it)) n++; }
    // 한쪽이 모자라면 다른 쪽 상위로 채우고, 그래도 모자라면 기타 유형으로 채움
    for (const it of [...issues, ...rest].sort((a, b) => b.dailyScore - a.dailyScore)) {
      if (picked.length >= total) break;
      take(it);
    }
    for (const it of etc) { if (picked.length >= total) break; take(it); }
    return picked.sort((a, b) => b.dailyScore - a.dailyScore).map((it, i) => ({ ...it, rank: i + 1 }));
  };

  KR.applyChange = (items, prevMap) =>
    items.map((it) => {
      const p = prevMap ? prevMap[it.keyword] : undefined;
      let change = 'NEW';
      if (p) {
        const d = p - it.rank;
        change = d > 0 ? `▲${d}` : d < 0 ? `▼${-d}` : '-';
      }
      return { ...it, change };
    });

  // 주제 찾기 추천 TOP N (이슈 30% / 시즌·에버그린 70%)
  KR.recommend = (items, n = 10, issueRatio = 0.3) => {
    const ok = items.filter((i) => i.opportunityScore != null).sort((a, b) => b.opportunityScore - a.opportunityScore);
    const iN = Math.round(n * issueRatio);
    const out = [];
    const has = new Set();
    const push = (it) => { if (!has.has(it.keyword) && out.length < n) { has.add(it.keyword); out.push(it); } };
    ok.filter((i) => i.type === '이슈').slice(0, iN).forEach(push);
    ok.filter((i) => i.type === '시즌' || i.type === '에버그린').slice(0, n - out.length).forEach(push);
    ok.filter((i) => i.type !== '기타').forEach(push);
    ok.forEach(push);
    return out.sort((a, b) => b.opportunityScore - a.opportunityScore);
  };

  // ---------- 정렬 ----------
  KR.sortItems = (items, key) => {
    const arr = [...items];
    const num = (v, d) => (v == null || Number.isNaN(v) ? d : v);
    const f = {
      rank: (a, b) => num(a.rank, 9999) - num(b.rank, 9999),
      opp: (a, b) => num(b.opportunityScore, -1) - num(a.opportunityScore, -1),
      D: (a, b) => num(b.D, -1) - num(a.D, -1),
      T: (a, b) => num(b.T, -1) - num(a.T, -1),
      S: (a, b) => num(a.S, 1e12) - num(b.S, 1e12),
      O: (a, b) => num(b.O, -1) - num(a.O, -1),
    }[key];
    return f ? arr.sort(f) : arr;
  };

  // ---------- 분석요청문 ----------
  KR.buildPrompt = (it) => {
    const pct = (v) => Math.round((Number(v) || 0) * 100);
    const tp = it.titlePattern || {};
    const top = (it.top10Titles || []).map((x, i) => `${i + 1}) ${x.t}`).join(' / ') || '없음';
    const src = (it.sources || []).map((s) => KR.SOURCE_NAMES[s] || s).join(', ');
    return [
      '아래는 네이버 블로그 키워드 분석 결과다. 이 키워드로 상위 노출을 노리는 블로그 글을 기획하라.',
      `[키워드] ${it.keyword} / [분야] ${it.category} / [유형] ${it.type} / [기회점수] ${it.opportunityScore ?? '-'}`,
      `[수요] 앵커 대비 ${it.D ?? '-'} / 상승률 ${it.T ?? '-'}배 / 시즌성 ${it.Y ?? '-'} (전년 피크: ${it.peakMonth || '-'})`,
      `[공급] 문서 ${(it.S ?? 0).toLocaleString('ko-KR')}건 / 7일 내 발행 ${pct(it.F)}% / 상위10건 중 1년 경과 ${pct(it.O)}%`,
      `[화제 출처] ${src}`,
      `[상위 10건 제목] ${top}`,
      `[제목 패턴] 평균 ${tp.avgLen ?? 0}자, 숫자 ${tp.numRate ?? 0}%, 연도 ${tp.yearRate ?? 0}%, 질문형 ${tp.qRate ?? 0}%`,
      '요청',
      '1. 검색 의도 3가지 추정 (정보형/비교형/구매형, 근거 포함)',
      '2. 상위 10건이 다루지 못한 빈틈 3가지',
      '3. 제목 후보 5개 (상위 패턴 반영, 30자 이내)',
      '4. 목차 (H2 5~7개, 각 H2 아래 핵심 내용 한 줄)',
      '5. 함께 쓸 롱테일 키워드 5개',
      '6. 쇼핑커넥트로 연결할 상품 유형 (해당 없으면 "없음")',
      '원고는 쓰지 말고 기획까지만 출력한다.',
    ].join('\n');
  };
  KR.PROMPT_SEPARATOR = '\n\n────────────────────────────\n\n';

  // ---------- CSV ----------
  KR.toCSV = (rows, columns) => {
    const esc = (v) => {
      const s = v == null ? '' : String(v);
      return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };

    const body = rows.map((r) => columns.map((c) => esc(c.get(r))).join(',')).join('\r\n');
    return '﻿' + head + '\r\n' + body;
  };

  // ---------- 기본 설정 ----------
  const DEFAULT_CATS = [
    ['지원금·정책', '지원금, 환급금, 청년 혜택, 바우처, 근로장려금, 국민취업지원제도, 신청 방법, 정부24'],

    ['쇼핑정보', '가성비, 추천템, 할인, 비교, 선물, 최저가, 신상'],
    ['시즌정보', '추석, 김장, 수능, 크리스마스, 연말, 새해, 졸업, 입학'],
    ['요리정보', '레시피, 반찬, 에어프라이어, 자취 요리, 밀키트, 간단 요리, 제철 음식'],
    ['방송레시피', '편스토랑, 냉장고를 부탁해, 냉부해, 알토란, 방송 레시피, 셰프 레시피'],
  ];
  KR.DEFAULT_STOPWORDS = [
    '추천', '후기', '방법', '총정리', '연도', '정리', '꿀팁', '공유', '포스팅', '블로그', '오늘', '최신', '완벽', '정보',
    '이유', '진짜', '가지', '모든', '공식', '티저', 'MV', '영상', '예고', '풀버전', '하이라이트', '리액션', '브이로그',
    '라이브', '쇼츠', 'Shorts', 'shorts', '직캠', '속보', '단독', '근황', '최초', '공개', '모음', '레전드',
  ];
  KR.newCategoryId = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  KR.defaultSettings = () => ({
    version: 1,
    anchor: '다이어트',
    categories: DEFAULT_CATS.map(([name, seeds], i) => ({
      id: 'c' + i,
      name,
      enabled: true,
      weight: 1,
      seeds: seeds.split(',').map((s) => ({ word: s.trim(), days: [] })),
    })),
    stopwords: [...KR.DEFAULT_STOPWORDS],
    excludeKeywords: [],
    weights: { demand: 35, supply: 30, rise: 20, old: 15 },
    bonus: { cross: 5, googleTop: 3 },
    ratio: { issue: 15, rest: 35 },
    categoryCap: 12,
    concurrency: 4,
    feeds: { google: true, youtube: true, pann: true, theqoo: true },
    seedTotal: 70,
    feedMax: 80,
    candidateMax: 150,
  });
  // 저장된 설정을 기본값과 병합 (누락 키 보충, 시드 문자열 → 객체)
  KR.normalizeSettings = (s) => {
    const d = KR.defaultSettings();
    if (!s || typeof s !== 'object') return d;
    const out = { ...d, ...s };
    for (const k of ['weights', 'bonus', 'ratio', 'feeds']) out[k] = { ...d[k], ...(s[k] || {}) };
    out.categories = (Array.isArray(s.categories) && s.categories.length ? s.categories : d.categories).map((c) => ({
      id: c.id || KR.newCategoryId(),
      name: String(c.name || '분야'),
      enabled: c.enabled !== false,
      weight: KR.clamp(Number(c.weight) || 1, 0.5, 2),
      seeds: (c.seeds || [])
        .map((x) => {
          if (typeof x === 'string') {
            try { return KR.parseSeed(x); } catch (e) { return { word: KR.seedWord(x), days: [] }; }
          }
          return x && x.word ? { word: String(x.word), days: Array.isArray(x.days) ? x.days.filter((ch) => DAY_CHARS.includes(ch)) : [] } : null;
        })
        .filter(Boolean)
        .slice(0, 30),
    }));
    out.stopwords = Array.isArray(s.stopwords) ? s.stopwords : d.stopwords;
    out.excludeKeywords = Array.isArray(s.excludeKeywords) ? s.excludeKeywords : [];
    out.concurrency = KR.clamp(parseInt(out.concurrency, 10) || 4, 1, 8);
    return out;
  };

  root.KR = KR;
  if (typeof module !== 'undefined' && module.exports) module.exports = KR;

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* 대체 경로로 진행 */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;

// ===== Worker 호출 =====
class ApiError extends Error { constructor(msg, code) { super(msg); this.code = code; } }
const workerUrl = () => (lsGet('kr_worker_url', '') || CONFIG.WORKER_URL).replace(/\/+$/, '');

// 429·네트워크 오류는 1초·2초 지수 백오프로 최대 2회 재시도
async function api(path, { method = 'GET', params = null, body = null, kind = null, signal = null } = {}) {
  if (!S.user) throw new ApiError('로그인 필요', 401);
  const base = workerUrl();
  if (!base || base.includes('YOUR-SUBDOMAIN')) throw new ApiError('Worker 주소 미설정. 설정 탭에서 입력할 것', 0);
  const url = new URL(base + path);
  if (params) Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  let lastErr = null;
  for (let attempt = 0; attempt <= 2; attempt++) {
    if (signal && signal.aborted) throw abortError();
    try {
      const token = await S.user.getIdToken();
      const headers = { Authorization: 'Bearer ' + token };
      if (body) headers['Content-Type'] = 'application/json';
      const res = await fetch(url.toString(), { method, headers, body: body ? JSON.stringify(body) : undefined, signal });
      if (res.status !== 401 && res.status !== 403) addUsage(kind);
      let data = null;
      try { data = await res.json(); } catch (e) { data = null; }
      if (res.ok) return data;
      const err = new ApiError((data && data.error) || `HTTP ${res.status}`, (data && data.code) || res.status);
      err.body = data;
      if (res.status === 429 && attempt < 2) { lastErr = err; await sleep(1000 * 2 ** attempt, signal); continue; }
      throw err;
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      if (e instanceof ApiError) throw e;
      lastErr = new ApiError('네트워크 오류: ' + (e.message || e), 0);
      if (attempt < 2) { await sleep(1000 * 2 ** attempt, signal); continue; }
      throw lastErr;
    }
  }
  throw lastErr || new ApiError('요청 실패', 0);
}

// 동시 실행 개수 제한 큐
async function runQueue(tasks, concurrency, { signal, onDone } = {}) {
  const results = new Array(tasks.length);
  let next = 0;
  const worker = async () => {
    while (next < tasks.length) {
      if (signal && signal.aborted) return;
      const idx = next++;
      try { results[idx] = { ok: true, value: await tasks[idx]() }; }
      catch (e) { results[idx] = { ok: false, error: e }; if (e && e.name === 'AbortError') return; }
      if (onDone) onDone(idx, results[idx]);
    }
  };
  await Promise.all(Array.from({ length: Math.max(1, Math.min(concurrency, tasks.length)) }, worker));
  if (signal && signal.aborted) throw abortError();
  return results;
}

async function batchWrite(ops) {

    const b = writeBatch(db);
    ops.slice(i, i + 400).forEach((op) => {
      if (op.type === 'delete') b.delete(op.ref);
      else b.set(op.ref, op.data, op.merge ? { merge: true } : {});
    });
    await b.commit();
  }
}

// ===== 공통 분석 엔진 (트렌드 → 블로그·뉴스, 키워드 캐시 24시간) =====
// results: keyword -> {trend, supply, error, done} (이어하기를 위해 외부 객체를 직접 갱신)
async function analyzeCandidates(cands, { signal, onProgress, results = {}, force = false, onCheckpoint } = {}) {
  const st = S.settings;
  const anchor = st.anchor.trim();
  const today = KR.kstDate();
  const endDate = KR.addDays(today, -1);
  const startDate = KR.addDays(endDate, -727); // 104주
  const conc = st.concurrency;
  const prog = (p) => onProgress && onProgress(p);
  const todo = cands.filter((c) => force || !(results[c.keyword] && results[c.keyword].done));
  const now = Date.now();

  prog({ key: 'cache', label: '캐시 확인', done: 0, total: todo.length });
  const cache = force ? {} : await loadCache(todo.map((c) => c.keyword), signal);
  for (const c of todo) {
    const r = results[c.keyword] || (results[c.keyword] = { keyword: c.keyword });
    delete r.error;
    r.done = false;
    if (force) { r.trend = null; r.supply = null; }
    const cd = cache[c.keyword];
    if (!r.trend && cd && cd.trend && cd.anchor === anchor && now - (cd.trendAt || 0) < DAY_MS) r.trend = cd.trend;
    if (!r.supply && cd && cd.supply && now - (cd.supplyAt || 0) < DAY_MS) r.supply = cd.supply;
  }

  const pending = new Map();
  const flush = async () => {
    if (!pending.size) return;
    const ops = [...pending.entries()].map(([k, data]) => ({ type: 'set', ref: uref('keywordCache', kwId(k)), data: clean({ keyword: k, ...data }), merge: true }));
    pending.clear();
    try { await batchWrite(ops); } catch (e) { console.warn('캐시 저장 실패', e); }
  };

  try {
    // --- 트렌드: 후보 4개 + 앵커 1개씩 요청 ---
    const needT = todo.filter((c) => {
      if (results[c.keyword].trend) return false;
      if (KR.normKw(c.keyword) === KR.normKw(anchor)) { results[c.keyword].error = '앵커와 같은 키워드는 분석 불가'; return false; }
      return true;
    });
    const groups = [];
    for (let i = 0; i < needT.length; i += 4) groups.push(needT.slice(i, i + 4));
    let doneT = 0;
    prog({ key: 'trend', label: '트렌드 분석', done: 0, total: needT.length });
    await runQueue(groups.map((g) => async () => {
      try {
        const body = {
          startDate, endDate, timeUnit: 'week',
          keywordGroups: [{ groupName: anchor, keywords: [anchor] }, ...g.map((c) => ({ groupName: c.keyword, keywords: [c.keyword] }))],
        };
        const res = await api('/api/trend', { method: 'POST', body, kind: 'trend', signal });
        const rs = (res && res.results) || [];
        const grid = KR.buildGrid(rs, endDate);
        const aSeries = KR.seriesFor(rs.find((r) => r.title === anchor), grid);
        for (const c of g) {
          const tm = KR.trendMetrics(KR.seriesFor(rs.find((x) => x.title === c.keyword), grid), aSeries, grid);
          results[c.keyword].trend = tm;
          pending.set(c.keyword, { ...(pending.get(c.keyword) || {}), anchor, trend: tm, trendAt: Date.now() });
        }
      } catch (e) {
        if (e.name === 'AbortError') throw e;
        g.forEach((c) => { results[c.keyword].error = '트렌드: ' + e.message; });
      } finally {
        doneT += g.length;
        prog({ key: 'trend', label: '트렌드 분석', done: doneT, total: needT.length });
      }
    }), conc, { signal });
    await flush();
    if (onCheckpoint) onCheckpoint();

    // --- 블로그 sim·date + 뉴스 (검색량 0 키워드는 생략) ---
    const needS = todo.filter((c) => {
      const r = results[c.keyword];
      return !r.error && !r.supply && r.trend && !r.trend.allZero;
    });
    let doneS = 0;
    prog({ key: 'supply', label: '블로그 분석', done: 0, total: needS.length });
    await runQueue(needS.map((c) => async () => {
      const q = c.keyword;
      try {
        const sim = await api('/api/blog', { params: { query: q, sort: 'sim', display: 100 }, kind: 'search', signal });
        const date = await api('/api/blog', { params: { query: q, sort: 'date', display: 100 }, kind: 'search', signal });
        const news = await api('/api/news', { params: { query: q, sort: 'date', display: 100 }, kind: 'search', signal });
        const sm = KR.supplyMetrics(sim, date, news, today);
        results[q].supply = sm;
        pending.set(q, { ...(pending.get(q) || {}), supply: sm, supplyAt: Date.now() });
      } catch (e) {
        if (e.name === 'AbortError') throw e;
        results[q].error = '블로그·뉴스: ' + e.message;
      } finally {
        doneS++;
        prog({ key: 'supply', label: '블로그 분석', done: doneS, total: needS.length });
        if (doneS % 20 === 0) { flush(); if (onCheckpoint) onCheckpoint(); }
      }
    }), conc, { signal });
  } finally {
    await flush();
  }

  for (const c of todo) {
    const r = results[c.keyword];
    r.done = !r.error && !!r.trend && (r.trend.allZero || !!r.supply);
  }
  return results;
}

// ===== 외부 피드 =====
async function fetchFeeds(signal, force = false) {
  const enabled = KR.FEED_SOURCES.filter((s) => S.settings.feeds[s]);
  const out = {};
  await Promise.all(enabled.map(async (src) => {
    try {
      const data = await api('/api/feed', { params: { source: src, ...(force ? { refresh: '1' } : {}) }, signal });
      if (src === 'youtube' && !data.cached) addUsage('youtube');
      out[src] = { items: data.items || [], fetchedAt: data.fetchedAt || null, cached: !!data.cached };
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      out[src] = { error: (e.body && e.body.error) || e.message || 'PARSE_FAIL', items: [] };
    }
  }));
  return out;
}
const feedItemsMap = (data) => {
  const m = {};
  Object.entries(data || {}).forEach(([k, v]) => { if (!v.error) m[k] = v.items; });
  return m;
};

// 시드 → 블로그 sim 100건 제목 → 확장 후보
async function expandSeeds(seeds, perSeed, signal, onTick) {
  const stop = KR.makeStopSet(S.settings.stopwords);
  const out = [];
  let done = 0;
  await runQueue(seeds.map((sd, si) => async () => {
    try {
      const sim = await api('/api/blog', { params: { query: sd.word, sort: 'sim', display: 100 }, kind: 'search', signal });
      const titles = ((sim && sim.items) || []).map((i) => i.title);
      KR.expandSeed(titles, sd.word, stop).slice(0, perSeed).forEach((e) => {
        out.push({ keyword: e.phrase, category: sd.category, origin: 'seed', sources: ['naver'], isDaySeed: !!sd.isDaySeed, seed: sd.word, count: e.count, si });
      });
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      console.warn('시드 확장 실패', sd.word, e);
    } finally {
      done++;
      if (onTick) onTick(done, seeds.length);
    }
  }), S.settings.concurrency, { signal });
  return out.sort((a, b) => a.si - b.si || b.count - a.count);
}

// 피드 후보 + 시드 후보 병합 (중복 제거, 분야 태그, 제외 목록 적용)
function mergeCandidates(feedCands, seedCands, maxN) {
  const st = S.settings;
  const ex = excludedSet();
  const map = new Map();
  for (const f of feedCands || []) {
    const k = KR.normKw(f.keyword);
    if (!k || ex.has(k) || map.has(k)) continue;
    map.set(k, { keyword: f.keyword, category: KR.tagCategory(f.keyword, st), origin: 'feed', sources: [...(f.sources || [])], cross: !!f.cross, googleRank: f.googleRank || null, isDaySeed: false });
  }
  for (const s of seedCands || []) {
    const k = KR.normKw(s.keyword);
    if (!k || ex.has(k)) continue;
    if (map.has(k)) {
      const m = map.get(k);
      if (!m.sources.includes('naver')) m.sources.unshift('naver');
      if (m.category === '기타') m.category = s.category;
      m.isDaySeed = m.isDaySeed || s.isDaySeed;
      continue;
    }
    map.set(k, { keyword: s.keyword, category: s.category, origin: 'seed', sources: ['naver'], cross: false, googleRank: null, isDaySeed: !!s.isDaySeed });
  }
  return [...map.values()].slice(0, maxN);
}

// 저장·표시용 항목 필드 정리
const ITEM_FIELDS = ['rank', 'keyword', 'category', 'type', 'dailyScore', 'opportunityScore', 'D', 'T', 'Y', 'V', 'S', 'F', 'O', 'sources', 'change', 'top10Titles', 'titlePattern', 'sparkline52', 'badges', 'peakMonth', 'news7', 'isDaySeed', 'origin', 'cross', 'googleRank'];
const slimItem = (it) => { const o = {}; ITEM_FIELDS.forEach((f) => { if (it[f] !== undefined) o[f] = it[f]; }); return o; };
const pickMetrics = (it) => {

  ['D', 'T', 'Y', 'V', 'S', 'F', 'O', 'peakMonth', 'sources', 'top10Titles', 'titlePattern', 'sparkline52', 'badges', 'news7'].forEach((f) => { if (it[f] !== undefined) o[f] = it[f]; });

};

const STAGES = ['화제 피드 수집', '시드 확장', '후보 확정', '트렌드 분석', '블로그·뉴스 분석', '점수·선정', '저장'];
const CP_KEY = 'kr_checkpoint';

function setStage(i, done = 0, total = 0, extra = '') {

}
function tickTop(done, total, extra) {

async function loadPrevMap(today) {
  const dates = Object.keys(S.index || {}).filter((d) => d <= today).sort().reverse();
  const target = dates[0];
  if (!target) return {};
  let d = S.top.doc && S.top.doc.date === target ? S.top.doc : null;
  if (!d) { const snap = await getDoc(uref('daily', target)); d = snap.exists() ? snap.data() : null; }

  ((d && d.items) || []).forEach((it) => { m[it.keyword] = it.rank; });

// 날짜 인덱스 갱신 + 30일 초과분 삭제
async function updateIndex(date, docData) {
  const idx = { ...(S.index || {}) };
  idx[date] = { status: docData.status, generatedAt: docData.generatedAt, count: (docData.items || []).length };
  const cutoff = KR.addDays(KR.kstDate(), -29);
  const old = Object.keys(idx).filter((d) => d < cutoff);
  old.forEach((d) => delete idx[d]);
  await setDoc(uref('meta', 'daily'), { entries: idx });
  S.index = idx;
  if (old.length) await batchWrite(old.map((d) => ({ type: 'delete', ref: uref('daily', d) })));
}

const docStatus = (items, failedCount) =>
  failedCount > 0 || items.length < (Number(S.settings.ratio.issue) || 0) + (Number(S.settings.ratio.rest) || 0) ? 'partial' : 'complete';

async function generateTop50(resume) {
  if (S.running) { toast('다른 분석이 진행 중임'); return; }
  const today = KR.kstDate();
  let cp = resume ? lsGet(CP_KEY) : null;
  if (!cp || cp.date !== today) cp = { date: today, stage: 0, startedAt: Date.now(), usageStart: getUsage(), results: {} };
  const saveCp = () => { if (!lsSet(CP_KEY, cp)) lsSet(CP_KEY, { ...cp, results: {} }); };
  S.running = true;
  S.abort = new AbortController();
  const signal = S.abort.signal;
  S.top.date = today;
  S.top.error = null;
  try {
    // ① 화제 피드
    if (cp.stage < 1) {
      setStage(0, 0, 1);
      const anyFeed = KR.FEED_SOURCES.some((s) => S.settings.feeds[s]);
      const feeds = anyFeed ? await fetchFeeds(signal) : {};
      S.feed.data = feeds;
      S.feed.fetchedAt = Date.now();
      cp.feedStatus = Object.fromEntries(Object.entries(feeds).map(([k, v]) => [k, v.error ? 'fail' : 'ok']));
      cp.feedCands = KR.extractFeedKeywords(feedItemsMap(feeds), KR.makeStopSet(S.settings.stopwords), S.settings.feedMax);
      S.feed.cands = cp.feedCands;
      cp.stage = 1;
      saveCp();
    }
    // ② 시드 확장 (요일 지정 시드 우선 + 요일별 순환)
    if (cp.stage < 2) {
      const seeds = KR.selectSeeds(S.settings, today);
      cp.usedSeeds = seeds;
      const room = Math.max(0, S.settings.candidateMax - (cp.feedCands || []).length);
      const perSeed = seeds.length ? KR.clamp(Math.ceil(room / seeds.length), 1, 5) : 0;
      setStage(1, 0, seeds.length);
      cp.seedCands = await expandSeeds(seeds, perSeed, signal, (d, t) => tickTop(d, t));
      cp.stage = 2;
      saveCp();
    }
    // ③ 후보 확정
    if (cp.stage < 3) {
      setStage(2, 0, 1);
      cp.candidates = mergeCandidates(cp.feedCands, cp.seedCands, S.settings.candidateMax + 10);
      if (!cp.candidates.length) throw new Error('후보가 없음. 시드·피드 설정을 확인할 것');
      cp.stage = 3;
      saveCp();
    }
    // ④⑤ 트렌드 → 블로그·뉴스
    if (cp.stage < 5) {
      setStage(3, 0, cp.candidates.length);
      await analyzeCandidates(cp.candidates, {
        signal,
        results: cp.results,
        onCheckpoint: saveCp,
        onProgress: (p) => {
          const idx = p.key === 'supply' ? 4 : 3;
          if (!S.top.progress || S.top.progress.stage !== idx) setStage(idx, p.done, p.total, p.label);
          else tickTop(p.done, p.total, p.label);
        },
      });
      cp.stage = 5;
      saveCp();
    }
    // ⑥ 점수·선정
    setStage(5, 0, 1);
    const items = cp.candidates.map((c) => {
      const r = cp.results[c.keyword] || {};
      return { ...KR.composeItem(c, r.trend, r.supply, S.settings), error: r.error || null };
    });
    const failed = cp.candidates.filter((c) => (cp.results[c.keyword] || {}).error);
    const prev = await loadPrevMap(today);
    const top = KR.applyChange(KR.selectTop(items.filter((i) => !i.error), S.settings, excludedSet()), prev);
    // ⑦ 저장
    setStage(6, 0, 1);
    const u = getUsage();
    const us = cp.usageStart || {};
    const docData = clean({
      date: today,
      generatedAt: Date.now(),
      status: docStatus(top, failed.length),
      candidateCount: cp.candidates.length,
      failedCount: failed.length,
      failedCands: failed.slice(0, 60).map((c) => ({ ...c, error: cp.results[c.keyword].error })),
      feedStatus: cp.feedStatus || {},
      apiCalls: { trend: Math.max(0, (u.trend || 0) - (us.trend || 0)), search: Math.max(0, (u.search || 0) - (us.search || 0)), youtube: Math.max(0, (u.youtube || 0) - (us.youtube || 0)) },
      prev,
      usedSeeds: (cp.usedSeeds || []).map((s) => ({ word: s.word, category: s.category, isDaySeed: !!s.isDaySeed })),
      anchor: S.settings.anchor,
      items: top.map(slimItem),
    });
    await setDoc(uref('daily', today), docData);
    await updateIndex(today, docData);
    lsDel(CP_KEY);
    S.top.doc = docData;
    S.top.open.clear();
    toast(`TOP ${top.length} 생성 완료`);
  } catch (e) {
    saveCp();
    if (e.name === 'AbortError') toast('중지함. [이어서 진행]으로 계속할 수 있음', 3500);
    else { S.top.error = e.message; toast('오류: ' + e.message, 4500); }
  } finally {
    S.top.progress = null;
    S.running = false;
    S.abort = null;
    renderTop();
  }
}

// TOP 50 실패 키워드 개별 재시도 → 성공 시 순위에 다시 반영
async function retryTopFailed(kw) {
  const d = S.top.doc;
  if (!d || S.running) return;
  const cand = (d.failedCands || []).find((c) => c.keyword === kw);
  if (!cand) return;
  S.running = true;
  S.abort = new AbortController();
  toast(`'${kw}' 재시도 중…`);
  try {
    const res = await analyzeCandidates([cand], { signal: S.abort.signal, force: true });
    const r = res[kw];
    if (r.error) throw new Error(r.error);
    const it = KR.composeItem(cand, r.trend, r.supply, S.settings);
    const merged = KR.applyChange(KR.selectTop([...d.items, it], S.settings, excludedSet()), d.prev || {});
    d.items = merged.map(slimItem);
    d.failedCands = d.failedCands.filter((c) => c.keyword !== kw);
    d.failedCount = d.failedCands.length;
    d.status = docStatus(d.items, d.failedCount);
    await setDoc(uref('daily', d.date), clean(d));
    await updateIndex(d.date, d);
    toast(merged.some((x) => x.keyword === kw) ? `'${kw}' 순위 반영 완료` : `'${kw}' 분석 완료 (선정 기준 미달)`);
  } catch (e) {
    if (e.name !== 'AbortError') toast('재시도 실패: ' + e.message, 4000);
  } finally {
    S.running = false;
    S.abort = null;
    renderTop();
  }
}

function parseSeedInput() {
  return S.find.seedsInput.split(/[,，\n]/).map(KR.seedWord).filter(Boolean);
}
function addChips(list) {
  const have = new Set(S.find.chips.map((c) => KR.normKw(c.keyword)));
  let n = 0;
  for (const c of list) {
    const k = KR.normKw(c.keyword);
    if (!k || have.has(k)) continue;
    have.add(k);
    S.find.chips.push({ selected: true, origin: 'seed', sources: ['naver'], ...c });
    n++;
  }
  return n;
}

async function findExpand() {
  const seeds = parseSeedInput();
  if (!seeds.length) { toast('시드 키워드를 입력할 것'); return; }
  if (seeds.length > 5) { toast('시드는 최대 5개까지 가능함'); return; }
  if (S.running) { toast('다른 분석이 진행 중임'); return; }
  S.running = true;
  S.abort = new AbortController();
  S.find.progress = { label: '후보 확장', done: 0, total: seeds.length, stageStart: Date.now() };
  renderFind();
  const stop = KR.makeStopSet(S.settings.stopwords);
  const counts = new Map();
  try {
    let done = 0;
    await runQueue(seeds.map((sd) => async () => {
      try {
        const sim = await api('/api/blog', { params: { query: sd, sort: 'sim', display: 100 }, kind: 'search', signal: S.abort.signal });
        const titles = ((sim && sim.items) || []).map((i) => i.title);
        KR.expandSeed(titles, sd, stop).forEach((e) => {
          const cur = counts.get(e.phrase) || { keyword: e.phrase, count: 0, category: S.find.cat || KR.tagCategory(sd, S.settings) };
          cur.count += e.count;
          counts.set(e.phrase, cur);
        });
      } finally {
        done++;
        S.find.progress.done = done;
        updateProgressDom('#tab-find', S.find.progress);
      }
    }), S.settings.concurrency, { signal: S.abort.signal });
    const top = [...counts.values()].sort((a, b) => b.count - a.count).slice(0, 20);
    const n = addChips(top.map((c) => ({ keyword: c.keyword, category: c.category })));
    toast(n ? `후보 ${n}개 추가` : '확장된 후보가 없음. 다른 시드를 시도할 것');
  } catch (e) {
    if (e.name !== 'AbortError') toast('후보 확장 실패: ' + e.message, 4000);
  } finally {
    S.running = false;
    S.abort = null;
    S.find.progress = null;
    renderFind();
  }
}

async function attachShopping(items, code, signal) {
  const endDate = KR.addDays(KR.kstDate(), -1);
  const startDate = KR.addDays(endDate, -364);
  for (let i = 0; i < items.length; i += 5) {
    const chunk = items.slice(i, i + 5);
    try {
      const res = await api('/api/shopping', {
        method: 'POST',
        body: { startDate, endDate, timeUnit: 'week', category: String(code), keyword: chunk.map((it) => ({ name: it.keyword, param: [it.keyword] })) },
        kind: 'trend',
        signal,
      });
      ((res && res.results) || []).forEach((r) => {
        const it = chunk.find((x) => x.keyword === r.title);
        if (it) it.shopping = (r.data || []).map((d) => KR.round(Number(d.ratio) || 0, 1));
      });
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      toast('쇼핑인사이트 조회 실패: ' + e.message, 4000);
      break;
    }
  }
}

async function runFindAnalysis(chipsOverride) {
  if (S.running) { toast('다른 분석이 진행 중임'); return; }
  const chips = chipsOverride || S.find.chips.filter((c) => c.selected);
  if (!chips.length) { toast('분석할 후보를 선택할 것'); return; }
  const cands = chips.map((c) => ({
    keyword: c.keyword,
    category: c.category || S.find.cat || KR.tagCategory(c.keyword, S.settings),
    origin: c.origin || 'seed',
    sources: c.sources && c.sources.length ? c.sources : ['naver'],
    cross: !!c.cross,
    googleRank: c.googleRank || null,
    isDaySeed: false,
  }));
  S.running = true;
  S.abort = new AbortController();
  S.find.progress = { label: '분석 준비', done: 0, total: cands.length, stageStart: Date.now() };
  S.find.results = [];
  S.find.failed = [];
  S.find.open.clear();
  renderFind();
  try {
    const res = await analyzeCandidates(cands, {
      signal: S.abort.signal,
      onProgress: (p) => {
        const f = S.find.progress;
        if (f.label !== p.label) { S.find.progress = { label: p.label, done: p.done, total: p.total, stageStart: Date.now() }; renderFind(); }
        else { f.done = p.done; f.total = p.total; updateProgressDom('#tab-find', f); }
      },
    });
    const items = [];
    const failed = [];
    cands.forEach((c) => {
      const r = res[c.keyword] || {};
      if (r.error) failed.push({ ...c, error: r.error });
      else items.push(KR.composeItem(c, r.trend, r.supply, S.settings));
    });
    if (S.find.shop.trim()) {
      S.find.progress = { label: '쇼핑 클릭 추이', done: 0, total: 1, stageStart: Date.now() };
      renderFind();
      await attachShopping(items, S.find.shop.trim(), S.abort.signal);
    }
    S.find.results = items;
    S.find.failed = failed;
    toast(`분석 완료: ${items.length}개${failed.length ? ` · 실패 ${failed.length}개` : ''}`);
  } catch (e) {
    if (e.name !== 'AbortError') toast('분석 실패: ' + e.message, 4000);
    else toast('중지함');
  } finally {
    S.running = false;
    S.abort = null;
    S.find.progress = null;
    renderFind();
  }
}

async function retryFindFailed(kw) {

// 선택 키 → 주제 찾기 칩 데이터
function feedKeyToChip(key) {
  const [src, idxStr] = key.split(':');
  const idx = Number(idxStr);
  if (src === 'cross') {
    const c = S.feed.cands.filter((x) => x.cross)[idx];
    return c ? { keyword: c.keyword, origin: 'feed', sources: c.sources, cross: true, googleRank: c.googleRank } : null;
  }
  const it = ((S.feed.data[src] && S.feed.data[src].items) || [])[idx];
  if (!it) return null;
  const kw = KR.guessKeywordFromTitle(it.title, src, S.feed.cands);
  if (!kw) return null;
  const cand = S.feed.cands.find((c) => c.keyword === kw);
  return { keyword: kw, origin: 'feed', sources: cand ? cand.sources : [src], cross: cand ? cand.cross : false, googleRank: cand ? cand.googleRank : null };
}

// ===== 저장함 =====
async function saveItem(it) {
  const prev = S.saved.get(it.keyword);
  const data = clean({
    keyword: it.keyword,
    category: it.category,
    type: it.type,
    savedAt: (prev && prev.savedAt) || Date.now(),
    updatedAt: Date.now(),
    score: it.dailyScore ?? it.opportunityScore ?? null,
    opportunityScore: it.opportunityScore ?? null,
    metrics: pickMetrics(it),
    memo: (prev && prev.memo) || '',
    status: (prev && prev.status) || '후보',
  });
  try {
    await setDoc(uref('savedKeywords', kwId(it.keyword)), data);
    S.saved.set(it.keyword, data);
    toast(prev ? '저장 내용 갱신함' : '저장함');
  } catch (e) {
    toast('저장 실패: ' + e.message, 4000);
  }
}
async function updateSaved(kw, patch) {
  const cur = S.saved.get(kw);
  if (!cur) return;
  const data = { ...cur, ...patch, updatedAt: Date.now() };
  try {
    await setDoc(uref('savedKeywords', kwId(kw)), clean(data));
    S.saved.set(kw, data);
  } catch (e) {
    toast('저장 실패: ' + e.message, 4000);
  }
}
async function reanalyzeSaved(kw) {
  const s = S.saved.get(kw);
  if (!s || S.running) return;
  S.running = true;
  S.abort = new AbortController();
  renderSaved();
  toast(`'${kw}' 재분석 중…`);
  try {
    const cand = { keyword: kw, category: s.category, origin: 'seed', sources: (s.metrics && s.metrics.sources) || ['naver'] };
    const res = await analyzeCandidates([cand], { signal: S.abort.signal, force: true });
    const r = res[kw];
    if (r.error) throw new Error(r.error);
    const it = KR.composeItem(cand, r.trend, r.supply, S.settings);
    await updateSaved(kw, { type: it.type, score: it.dailyScore ?? it.opportunityScore ?? null, opportunityScore: it.opportunityScore ?? null, metrics: pickMetrics(it) });
    toast('재분석 완료');
  } catch (e) {
    if (e.name !== 'AbortError') toast('재분석 실패: ' + e.message, 4000);
  } finally {
    S.running = false;
    S.abort = null;
    renderSaved();
  }
}
const savedToItem = (s) => ({ ...(s.metrics || {}), keyword: s.keyword, category: s.category, type: s.type, opportunityScore: s.opportunityScore ?? s.score });

// ===== 화면: 공통 조각 =====
const SRC_ICON = { naver: ['N', '네이버'], google: ['G', '구글 트렌드'], youtube: ['Y', '유튜브'], pann: ['판', '네이트 판'], theqoo: ['더', '더쿠'] };
const srcIcons = (arr) => (arr || []).map((s) => (SRC_ICON[s] ? `<i class="src src-${s}" title="${SRC_ICON[s][1]}">${SRC_ICON[s][0]}</i>` : '')).join('');
const TYPE_CLS = { 이슈: 't-issue', 시즌: 't-season', 에버그린: 't-ever', 기타: 't-etc' };
const typeBadge = (t) => `<span class="badge ${TYPE_CLS[t] || 't-etc'}">${esc(t || '기타')}</span>`;
const chgCls = (c) => (!c ? '' : c === 'NEW' ? 'new' : c[0] === '▲' ? 'up' : c[0] === '▼' ? 'down' : 'same');
const pct = (v) => Math.round((Number(v) || 0) * 100);
const fmtNum = (v) => (Number(v) || 0).toLocaleString('ko-KR');

function sparkSvg(vals, label = '52주 추이') {
  if (!vals || vals.length < 2) return '<div class="muted small">추이 데이터 없음</div>';
  const w = 300;
  const h = 56;
  const max = Math.max(...vals, 1e-9);
  const n = vals.length;
  const pts = vals.map((v, i) => [(i / (n - 1)) * (w - 4) + 2, h - 3 - (v / max) * (h - 8)]);
  const line = pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const area = `2,${h - 2} ${line} ${w - 2},${h - 2}`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">` +
    `<polygon points="${area}" class="sp-area"/><polyline points="${line}" class="sp-line" fill="none" vector-effect="non-scaling-stroke"/></svg>`;
}

function progressMeta(p) {
  const el = (Date.now() - p.stageStart) / 1000;
  let eta = '';
  if (p.done > 0 && p.total > p.done) {
    const rem = Math.max(1, Math.round((el / p.done) * (p.total - p.done)));
    eta = ` · 남은 시간 약 ${rem >= 60 ? Math.floor(rem / 60) + '분 ' : ''}${rem % 60}초`;
  }
  return `${esc(p.extra || p.label)} ${p.done}/${p.total}${eta}`;
}
function progressHtml(p) {
  const w = p.total ? Math.round((p.done / p.total) * 100) : 0;
  const head = p.stage != null ? `단계 ${p.stage + 1}/7 · ${esc(p.label)}` : esc(p.label);
  return `<div class="progress" data-el="progress"><div class="pg-head"><b>${head}</b><button class="btn small" data-act="stop">중지</button></div>` +
    `<div class="pg-bar"><i style="width:${w}%"></i></div><div class="pg-meta">${progressMeta(p)}</div></div>`;
}
function updateProgressDom(sel, p) {
  const box = $(sel + ' [data-el="progress"]');
  if (!box) return;
  const w = p.total ? Math.round((p.done / p.total) * 100) : 0;
  box.querySelector('.pg-bar i').style.width = w + '%';
  box.querySelector('.pg-meta').innerHTML = progressMeta(p);
}

function filterHtml(ctx, items) {
  const f = S[ctx].filter;
  const cats = [...new Set(items.map((i) => i.category))].sort();
  const sorts = ctx === 'top'
    ? [['rank', '순위'], ['opp', '기회점수'], ['D', '수요'], ['T', '상승률'], ['S', '공급 적은 순'], ['O', '노후도 높은 순']]
    : [['opp', '기회점수'], ['D', '수요'], ['T', '상승률'], ['S', '공급 적은 순'], ['O', '노후도 높은 순']];
  const opt = (v, l, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(l)}</option>`;
  return `<div class="filters">
    <select data-flt="sort" aria-label="정렬">${sorts.map(([v, l]) => opt(v, l, S[ctx].sort)).join('')}</select>
    <select data-flt="cat" aria-label="분야">${opt('', '전체 분야', f.cat)}${cats.map((c) => opt(c, c, f.cat)).join('')}</select>
    <select data-flt="type" aria-label="유형">${opt('', '전체 유형', f.type)}${['이슈', '시즌', '에버그린', '기타'].map((t) => opt(t, t, f.type)).join('')}</select>
    <select data-flt="src" aria-label="출처">${opt('', '전체 출처', f.src)}${Object.keys(SRC_ICON).map((s) => opt(s, SRC_ICON[s][1], f.src)).join('')}</select>
    ${ctx === 'top' ? `<label class="chk"><input type="checkbox" data-flt="onlyNew" ${f.onlyNew ? 'checked' : ''}> NEW만</label>` : ''}
  </div>`;
}
function applyFilters(items, ctx) {
  const f = S[ctx].filter;
  const arr = items.filter((it) =>
    (!f.cat || it.category === f.cat) &&
    (!f.type || it.type === f.type) &&
    (!f.src || (it.sources || []).includes(f.src)) &&
    (!f.onlyNew || it.change === 'NEW'));
  return KR.sortItems(arr, S[ctx].sort);
}

function detailHtml(it) {
  const rows = [
    ['D 수요', it.D ?? '-', '앵커 대비'],
    ['T 상승', it.T != null ? it.T + '배' : '-', (it.badges || []).includes('데이터부족') ? '데이터부족' : '최근4주÷직전8주'],
    ['Y 시즌', it.Y ?? '-', it.peakMonth ? '전년 피크 ' + it.peakMonth : ''],
    ['V 안정', it.V ?? '-', '낮을수록 꾸준'],
    ['S 문서', fmtNum(it.S), '블로그 총량'],
    ['F 신선', pct(it.F) + '%', '7일 내 발행'],
    ['O 노후', pct(it.O) + '%', '상위10 중 1년 경과'],
    ['뉴스', (it.news7 ?? 0) + '건', '최근 7일'],
  ];
  const tp = it.titlePattern || {};
  const saved = S.saved.has(it.keyword);
  return `<div class="item-body">
    <div class="metrics">${rows.map(([k, v, s]) => `<div class="m"><span>${k}</span><b>${esc(v)}</b><small>${esc(s)}</small></div>`).join('')}</div>
    <div class="spark-box"><div class="small muted">최근 52주 검색 추이 (앵커 대비 상대값)</div>${sparkSvg(it.sparkline52)}</div>
    ${it.shopping ? `<div class="spark-box"><div class="small muted">쇼핑 클릭 추이 (최근 1년)</div>${sparkSvg(it.shopping, '쇼핑 클릭 추이')}</div>` : ''}
    <div class="pattern small">상위 제목 패턴: 평균 ${tp.avgLen ?? 0}자 · 숫자 ${tp.numRate ?? 0}% · 연도 ${tp.yearRate ?? 0}% · 질문형 ${tp.qRate ?? 0}%</div>
    <ol class="top10">${(it.top10Titles || []).map((x) => `<li><a href="${esc(x.l)}" target="_blank" rel="noopener">${esc(x.t)}</a><small>${esc(x.d)}</small></li>`).join('') || '<li class="muted">상위 글 없음</li>'}</ol>
    <div class="row">
      <button class="btn" data-act="save">${saved ? '저장 갱신' : '저장'}</button>
      <button class="btn primary" data-act="copy">분석요청문 복사</button>
    </div>
  </div>`;
}

function itemHtml(it, ctx, idx, max) {
  const open = S[ctx].open.has(it.keyword);
  const score = ctx === 'top' ? it.dailyScore : it.opportunityScore;
  const rank = ctx === 'top' ? it.rank : idx + 1;
  const w = score == null ? 0 : Math.max(3, Math.round((score / max) * 100));
  return `<div class="item ${open ? 'open' : ''}" data-kw="${esc(it.keyword)}">
    <button class="item-head" data-act="toggle" aria-expanded="${open}">
      <div class="l1"><span class="rank">${rank}</span>${ctx === 'top' ? `<span class="chg ${chgCls(it.change)}">${esc(it.change || '')}</span>` : ''}<span class="kw">${esc(it.keyword)}</span><span class="srcs">${srcIcons(it.sources)}</span></div>
      <div class="l2"><span class="badge cat">${esc(it.category)}</span>${typeBadge(it.type)}${(it.badges || []).map((b) => `<span class="badge flag">${esc(b)}</span>`).join('')}<span class="score"><span class="bar"><i style="width:${w}%"></i></span><b>${score ?? '-'}</b></span></div>
    </button>
    ${open ? detailHtml(it) : ''}
  </div>`;
}
function listHtml(items, ctx) {
  if (!items.length) return '<div class="empty">조건에 맞는 항목 없음</div>';
  const max = Math.max(1, ...items.map((i) => (ctx === 'top' ? i.dailyScore : i.opportunityScore) || 0));
  return `<div class="list">${items.map((it, i) => itemHtml(it, ctx, i, max)).join('')}</div>`;
}
function failedHtml(list) {
  if (!list || !list.length) return '';
  return `<details class="card failed"><summary>분석 실패 ${list.length}개 (개별 재시도 가능)</summary>
    ${list.map((f) => `<div class="frow" data-kw="${esc(f.keyword)}"><b>${esc(f.keyword)}</b><small class="muted">${esc(f.error || '')}</small><button class="btn small" data-act="retry">재시도</button></div>`).join('')}
  </details>`;
}

// ===== 화면: 탭1 오늘의 TOP 50 =====
function renderTop() {
  const el = $('#tab-top');
  if (!el || !S.settings) return;
  const t = S.top;
  const today = KR.kstDate();
  const dates = Array.from({ length: 30 }, (_, i) => KR.addDays(today, -i));
  let html = `<div class="toolbar">
    <select data-el="date" aria-label="날짜" ${S.running ? 'disabled' : ''}>${dates.map((d) => `<option value="${d}" ${d === t.date ? 'selected' : ''}>${d}${d === today ? ' (오늘)' : ''}${S.index[d] ? ' ✓' : ''}</option>`).join('')}</select>
  </div>`;
  if (S.running && t.progress) {
    html += progressHtml(t.progress);
  } else {
    const cp = lsGet(CP_KEY);
    if (cp && cp.date === today && t.date === today && !S.running) {
      html += `<div class="notice">진행 중이던 생성 작업이 있음 (단계 ${Math.min(7, (cp.stage || 0) + 1)}/7부터 재개)
        <div class="row"><button class="btn primary" data-act="resume">이어서 진행</button><button class="btn" data-act="restart">처음부터</button></div></div>`;
    }
    if (t.error) html += `<div class="notice bad">오류: ${esc(t.error)}</div>`;
  }
  if (t.loading) {
    html += '<div class="empty">불러오는 중…</div>';
  } else if (!t.doc) {
    if (!t.progress && t.date === today) {
      const cm = S.settings.candidateMax;
      html += `<div class="hero">
        <button class="btn primary big" data-act="generate" ${S.running ? 'disabled' : ''}>오늘의 TOP 50 생성</button>
        <p>예상 소요 1~2분 · 예상 API 사용량: 트렌드 약 ${Math.ceil(cm / 4)}회, 검색 약 ${S.settings.seedTotal + cm * 3}회, 유튜브 1회</p>
        <p class="muted small">24시간 이내 분석한 키워드는 캐시를 사용해 호출이 줄어듦</p>
      </div>`;
    } else if (!t.progress) {
      html += `<div class="empty">${esc(t.date)} 생성 결과 없음</div>`;
    }
  } else if (!t.progress) {
    const d = t.doc;
    const fs = Object.entries(d.feedStatus || {}).filter(([, v]) => v === 'fail').map(([k]) => KR.SOURCE_NAMES[k] || k);
    const ac = d.apiCalls || {};
    html += `<div class="meta-bar">
      <div class="small">생성 ${KR.formatTime(d.generatedAt)} · <span class="st ${d.status}">${d.status === 'complete' ? '완료' : '부분 결과'}</span> · 후보 ${d.candidateCount}개 · ${d.items.length}개 선정 · API 트렌드 ${ac.trend ?? 0}/검색 ${ac.search ?? 0}${fs.length ? ` · <span class="bad-t">수집 실패: ${esc(fs.join(', '))}</span>` : ''}</div>
      <div class="row">
        ${d.date === today ? `<button class="btn" data-act="regen" ${S.running ? 'disabled' : ''}>다시 생성</button>` : ''}
        <button class="btn" data-act="csv">CSV 내보내기</button>
        <button class="btn" data-act="copy10">상위 10개 분석요청문 복사</button>
      </div>
      ${d.usedSeeds && d.usedSeeds.length ? `<details class="small"><summary>사용 시드 ${d.usedSeeds.length}개</summary><div class="seedlist">${d.usedSeeds.map((s) => `<span class="${s.isDaySeed ? 'dayseed' : ''}">${esc(s.word)}</span>`).join('')}</div></details>` : ''}
    </div>`;
    html += failedHtml(d.failedCands);
    html += filterHtml('top', d.items) + listHtml(applyFilters(d.items, 'top'), 'top');
  }
  el.innerHTML = html;
}

  const el = $('#tab-saved');
  if (!el || !S.settings) return;
  const all = [...S.saved.values()].sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
  const cats = [...new Set(all.map((s) => s.category))].sort();
  const list = all.filter((s) => !S.savedUI.cat || s.category === S.savedUI.cat);
  let html = `<div class="toolbar">
    <select data-el="savedCat" aria-label="분야"><option value="">전체 분야 (${all.length})</option>${cats.map((c) => `<option ${c === S.savedUI.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
    <span class="grow"></span>
    <button class="btn" data-act="savedCsv" ${list.length ? '' : 'disabled'}>CSV 내보내기</button>
  </div>`;
  if (!list.length) html += '<div class="empty">저장한 키워드 없음. 결과 카드의 [저장]으로 추가함</div>';
  html += list.map((s) => `<div class="card sitem" data-kw="${esc(s.keyword)}">
    <div class="l1"><b class="kw">${esc(s.keyword)}</b><span class="badge cat">${esc(s.category)}</span>${typeBadge(s.type)}<span class="sc">${s.score ?? '-'}</span></div>
    <div class="small muted">저장 ${KR.formatTime(s.savedAt)}${s.updatedAt && s.updatedAt !== s.savedAt ? ' · 갱신 ' + KR.formatTime(s.updatedAt) : ''}</div>
    <div class="row">
      <select data-el="status" aria-label="상태">${['후보', '작성중', '발행'].map((v) => `<option ${v === s.status ? 'selected' : ''}>${v}</option>`).join('')}</select>
      <button class="btn small" data-act="sreanalyze" ${S.running ? 'disabled' : ''}>재분석</button>
      <button class="btn small" data-act="scopy">분석요청문 복사</button>
      <button class="btn small danger" data-act="sdel">삭제</button>
    </div>
    <textarea data-el="memo" rows="2" placeholder="메모">${esc(s.memo || '')}</textarea>
  </div>`).join('');
  el.innerHTML = html;
}

// ===== 화면 전환 =====
const PANELS = { top: renderTop, find: renderFind, feed: renderFeed, saved: renderSaved, settings: renderSettings };
function showTab(tab) {
  S.tab = tab;
  document.querySelectorAll('#tabs [data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  Object.keys(PANELS).forEach((k) => { $('#tab-' + k).hidden = k !== tab; });
  if (tab === 'settings' && !S.draft) S.draft = clone(S.settings);
  PANELS[tab]();
  window.scrollTo(0, 0);
}
function renderWho() {
  const el = $('#who');
  if (!S.user) { el.innerHTML = ''; return; }
  el.innerHTML = `<span class="small" title="${esc(S.user.uid)}">${esc(S.user.email || S.user.displayName || '로그인됨')}</span><button class="btn small ghost" data-act="logout">로그아웃</button>`;
}
function showGate(kind, err) {
  $('#tabs').hidden = true;
  Object.keys(PANELS).forEach((k) => { $('#tab-' + k).hidden = true; });
  const g = $('#gate');
  g.hidden = false;
  renderWho();
  const ia = inAppInfo();
  const inAppBox = ia.inApp ? `<div class="notice">카카오톡·네이버앱 등 인앱 브라우저에서는 Google 로그인이 차단됨. 외부 브라우저로 열 것
      <div class="row"><button class="btn primary" data-act="openExternal">외부 브라우저로 열기</button><button class="btn" data-act="copyUrl">주소 복사</button></div></div>` : '';
  const body = {
    config: `<h2>초기 설정 필요</h2><p>index.html의 CONFIG.FIREBASE 값을 Firebase 콘솔의 웹 앱 설정값으로 바꿔서 배포할 것</p>`,
    login: `<h2>KEYWORD RADAR</h2><p>네이버 검색 수요 대비 경쟁이 약한 블로그 주제를 찾는 도구</p>${inAppBox}<button class="btn primary big" data-act="login">Google 계정으로 로그인</button>`,
    denied: `<h2>허용되지 않은 계정</h2><p>이 앱은 지정된 계정만 사용할 수 있음</p><p class="small muted">현재 UID: <code>${esc(S.user ? S.user.uid : '')}</code></p><button class="btn" data-act="logout">로그아웃</button>`,

    error: `<h2>불러오기 실패</h2><p class="bad-t">${esc(err ? err.message : '')}</p><p class="small muted">Firestore 보안규칙과 UID를 확인할 것. 현재 UID: <code>${esc(S.user ? S.user.uid : '')}</code></p><div class="row"><button class="btn" data-act="copyUid">UID 복사</button><button class="btn" data-act="logout">로그아웃</button></div>`,

function showApp() {
  $('#gate').hidden = true;
  $('#tabs').hidden = false;
  renderWho();
